# The AngularJS surface, idiom by idiom, as the port meets it.
#
# One entry per API the legacy code can use, grouped by the shape it takes in
# the syntax tree. The scan (scan-idioms) matches every occurrence in the
# legacy sources and templates against this list, so a repo's unknowns are
# named before anything is written; the port (scaffold-units) treats each
# entry by its class:
#
#   mechanical  the port rewrites it to the target, nothing left to read
#   note        the port rewrites it and leaves a comment saying how
#   decision    the port leaves a TODO(port) line; a person (or a model, on
#               request, one line at a time) chooses the Angular shape
#
# Shapes:
#   helper     angular.<name>                 module     angular.module(...).<name>(...)
#   token      an injection token             member     <token>.<name> (a call or a property)
#   scope      $scope.<name> / scope.<name>   ddo        a directive or component definition key
#   binding    a scope/bindings kind          hook       a controller lifecycle hook
#   require    a `require:` form              jqlite     <$element|angular.element(...)>.<name>
#   ngmodel    a $-member of an ngModel/form controller
#   provider   <xProvider>.<name> in config   event      a $-prefixed broadcast/emit/on name
#   attribute  a template directive (ng-*)    filter     a built-in template filter
#   expression a template expression form
#
# Sources: AngularJS 1.8 API reference (ng, ngRoute, ngAnimate, ngResource,
# ngSanitize, ngMessages, ngCookies, ngTouch, ngAria), angular-ui-router 0.4
# and 1.x. Third-party libraries (ui-bootstrap, angular-translate, toastr…)
# are not here on purpose: the scan lists what a repo uses of them as unknown,
# by name, so each gets a decision.
version: 1
idioms:
  # ── angular.* helpers ──────────────────────────────────────────────────
  - { id: helper.module,      shape: helper, match: angular.module,      class: mechanical, target: "the registration becomes the file" }
  - { id: helper.copy,        shape: helper, match: angular.copy,        class: mechanical, target: "structuredClone(x)", rewrite: { call: "structuredClone" } }
  - { id: helper.extend,      shape: helper, match: angular.extend,      class: mechanical, target: "Object.assign(...)", rewrite: { call: "Object.assign" } }
  - { id: helper.merge,       shape: helper, match: angular.merge,       class: decision,   target: "a deep merge: write one, or lodash merge when present", residue: "angular.merge: a deep merge; write one or use a library" }
  - { id: helper.equals,      shape: helper, match: angular.equals,      class: decision,   target: "a deep comparison: lodash isEqual when present", residue: "angular.equals: a deep comparison; write one or use a library" }
  - { id: helper.forEach,     shape: helper, match: angular.forEach,     class: decision,   target: "for…of, or Object.entries()", residue: "angular.forEach: for…of, or Object.entries()" }
  - { id: helper.isDefined,   shape: helper, match: angular.isDefined,   class: mechanical, target: "x !== undefined", rewrite: { predicate: ["(", " !== undefined)"] } }
  - { id: helper.isUndefined, shape: helper, match: angular.isUndefined, class: mechanical, target: "x === undefined", rewrite: { predicate: ["(", " === undefined)"] } }
  - { id: helper.isString,    shape: helper, match: angular.isString,    class: mechanical, target: "typeof x === 'string'", rewrite: { predicate: ["(typeof ", " === 'string')"] } }
  - { id: helper.isNumber,    shape: helper, match: angular.isNumber,    class: mechanical, target: "typeof x === 'number'", rewrite: { predicate: ["(typeof ", " === 'number')"] } }
  - { id: helper.isFunction,  shape: helper, match: angular.isFunction,  class: mechanical, target: "typeof x === 'function'", rewrite: { predicate: ["(typeof ", " === 'function')"] } }
  - { id: helper.isObject,    shape: helper, match: angular.isObject,    class: decision, target: "x !== null && typeof x === 'object'" }
  - { id: helper.isArray,     shape: helper, match: angular.isArray,     class: mechanical, target: "Array.isArray(x)", rewrite: { call: "Array.isArray" } }
  - { id: helper.isDate,      shape: helper, match: angular.isDate,      class: mechanical, target: "x instanceof Date", rewrite: { predicate: ["(", " instanceof Date)"] } }
  - { id: helper.isElement,   shape: helper, match: angular.isElement,   class: mechanical, target: "x instanceof Element", rewrite: { predicate: ["(", " instanceof Element)"] } }
  - { id: helper.toJson,      shape: helper, match: angular.toJson,      class: mechanical, target: "JSON.stringify(x)", rewrite: { call: "JSON.stringify" } }
  - { id: helper.fromJson,    shape: helper, match: angular.fromJson,    class: mechanical, target: "JSON.parse(x)", rewrite: { call: "JSON.parse" } }
  - { id: helper.noop,        shape: helper, match: angular.noop,        class: decision, target: "() => {}" }
  - { id: helper.identity,    shape: helper, match: angular.identity,    class: decision, target: "(x) => x" }
  - { id: helper.bind,        shape: helper, match: angular.bind,        class: decision, target: "fn.bind(self, ...)" }
  - { id: helper.lowercase,   shape: helper, match: angular.lowercase,   class: decision, target: "x.toLowerCase()", until: "1.6" }
  - { id: helper.uppercase,   shape: helper, match: angular.uppercase,   class: decision, target: "x.toUpperCase()", until: "1.6" }
  - { id: helper.element,     shape: helper, match: angular.element,     class: mechanical, target: "$(x) when jQuery is a dependency; else ElementRef.nativeElement", residue: "angular.element (jqLite): use ElementRef.nativeElement or a Renderer2" }
  - { id: helper.bootstrap,   shape: helper, match: angular.bootstrap,   class: decision,   target: "bootstrapApplication / platformBrowser().bootstrapModule — the bootstrap step" }
  - { id: helper.injector,    shape: helper, match: angular.injector,    class: decision,   target: "inject() / Injector.get" }
  - { id: helper.version,     shape: helper, match: angular.version,     class: decision,   target: "VERSION from @angular/core" }
  - { id: helper.errorHandlingConfig, shape: helper, match: angular.errorHandlingConfig, class: decision, target: "an ErrorHandler provider" }
  - { id: helper.reloadWithDebugInfo, shape: helper, match: angular.reloadWithDebugInfo, class: decision, target: "none; drop" }
  - { id: helper.mock,        shape: helper, match: angular.mock,        class: decision,   target: "TestBed" }
  # ── module registration kinds ──────────────────────────────────────────
  - { id: module.component,   shape: module, match: component,  class: mechanical, target: "@Component standalone", angular_min: "15", target_before: "@Component in an NgModule", since: "1.5" }
  - { id: module.directive,   shape: module, match: directive,  class: mechanical, target: "@Component when it has a template, else @Directive", angular_min: "15", target_before: "@Component / @Directive in an NgModule" }
  - { id: module.controller,  shape: module, match: controller, class: mechanical, target: "@Component (the template that names it)", angular_min: "15", target_before: "@Component in an NgModule" }
  - { id: module.factory,     shape: module, match: factory,    class: mechanical, target: "@Injectable({ providedIn: 'root' }); a returned constructor becomes the class" }
  - { id: module.service,     shape: module, match: service,    class: mechanical, target: "@Injectable({ providedIn: 'root' })" }
  - { id: module.provider,    shape: module, match: provider,   class: decision,   target: "@Injectable + an InjectionToken for the configured part" }
  - { id: module.filter,      shape: module, match: filter,     class: mechanical, target: "@Pipe" }
  - { id: module.constant,    shape: module, match: constant,   class: mechanical, target: "an exported const" }
  - { id: module.value,       shape: module, match: value,      class: mechanical, target: "an exported const, or an InjectionToken" }
  - { id: module.config,      shape: module, match: config,     class: decision,   target: "providers / route config / APP_INITIALIZER — see provider.*" }
  - { id: module.run,         shape: module, match: run,        class: decision,   target: "APP_INITIALIZER, or a root service constructor" }
  - { id: module.decorator,   shape: module, match: decorator,  class: decision,   target: "a subclass provided in place of the class", since: "1.4" }
  - { id: module.animation,   shape: module, match: animation,  class: decision,   target: "@angular/animations triggers" }
  - { id: module.requires,    shape: module, match: requires,   class: note,       target: "imports on the standalone component / module" }
  - { id: module.info,        shape: module, match: info,       class: mechanical, target: "none; drop" }
  # ── injection tokens (ng) ──────────────────────────────────────────────
  - { id: token.$scope,        shape: token, match: $scope,        class: note,       target: "component state: fields and signals on the class", rewrite: { note: "component state: fields and signals on this class" } }
  - { id: token.$rootScope,    shape: token, match: $rootScope,    class: decision,   target: "a root-provided service, or a signal in one", rewrite: { note: "a shared service, or a signal in a root-provided service" } }
  - { id: token.$element,      shape: token, match: $element,      class: mechanical, target: "inject(ElementRef)", residue: "$element (jqLite): this.element.nativeElement", rewrite: { inject: { prop: element, class: ElementRef, from: "@angular/core" } }, angular_min: "14" }
  - { id: token.$attrs,        shape: token, match: $attrs,        class: decision,   target: "inputs; HostAttributeToken for static attributes", residue: "$attrs: an input() on the component", rewrite: { note: "input() on the component" } }
  - { id: token.$transclude,   shape: token, match: $transclude,   class: decision,   target: "<ng-content>, or a TemplateRef input", residue: "$transclude: <ng-content>", rewrite: { note: "<ng-content>" } }
  - { id: token.$http,         shape: token, match: $http,         class: mechanical, target: "inject(HttpClient)", residue: "$http: this.http returns an Observable; the response body is the value, not .data", rewrite: { inject: { prop: http, class: HttpClient, from: "@angular/common/http" } }, angular_min: "14" }
  - { id: token.$httpBackend,  shape: token, match: $httpBackend,  class: decision,   target: "HttpTestingController (tests)" }
  - { id: token.$httpParamSerializer, shape: token, match: $httpParamSerializer, class: decision, target: "HttpParams" }
  - { id: token.$httpParamSerializerJQLike, shape: token, match: $httpParamSerializerJQLike, class: decision, target: "HttpParams, or qs" }
  - { id: token.$q,            shape: token, match: $q,            class: note,       target: "Promise, or an Observable", rewrite: { note: "use Promise, or an Observable" } }
  - { id: token.$timeout,      shape: token, match: $timeout,      class: mechanical, target: "setTimeout (a call), or an rxjs timer", rewrite: { note: "use setTimeout, or an rxjs timer" } }
  - { id: token.$interval,     shape: token, match: $interval,     class: mechanical, target: "setInterval (a call), or an rxjs interval", rewrite: { note: "use setInterval, or an rxjs interval" } }
  - { id: token.$window,       shape: token, match: $window,       class: note, target: "window", rewrite: { note: "use window directly, or inject(DOCUMENT).defaultView" } }
  - { id: token.$document,     shape: token, match: $document,     class: mechanical, target: "inject(DOCUMENT)", rewrite: { inject: { prop: document, class: DOCUMENT, from: "@angular/common" } }, angular_min: "14" }
  - { id: token.$location,     shape: token, match: $location,     class: note,       target: "inject(Router) / Location; the members are decisions", rewrite: { inject: { prop: router, class: Router, from: "@angular/router" } }, angular_min: "14" }
  - { id: token.$anchorScroll, shape: token, match: $anchorScroll, class: decision,   target: "ViewportScroller.scrollToAnchor" }
  - { id: token.$log,          shape: token, match: $log,          class: mechanical, target: "console", rewrite: { note: "console" } }
  - { id: token.$filter,       shape: token, match: $filter,       class: decision,   target: "inject the pipe class and call transform()", residue: "$filter: inject the pipe class and call transform()", rewrite: { note: "inject the pipe class and call transform()" } }
  - { id: token.$compile,      shape: token, match: $compile,      class: decision,   target: "not in Angular: compose with components, ViewContainerRef.createComponent", residue: "$compile: compose with components instead", rewrite: { note: "not in Angular: compose with components instead" } }
  - { id: token.$parse,        shape: token, match: $parse,        class: decision,   target: "not in Angular: a function input, or a small evaluator", residue: "$parse: bind in the template", rewrite: { note: "not in Angular: bind in the template" } }
  - { id: token.$interpolate,  shape: token, match: $interpolate,  class: decision,   target: "a template literal, or a pipe", residue: "$interpolate: bind in the template", rewrite: { note: "not in Angular: bind in the template" } }
  - { id: token.$templateCache,   shape: token, match: $templateCache,   class: note,     target: "templateUrl on the component", residue: "$templateCache: templateUrl on the component", rewrite: { note: "templateUrl on the component" } }
  - { id: token.$templateRequest, shape: token, match: $templateRequest, class: decision, target: "HttpClient.get(url, { responseType: 'text' })", since: "1.3" }
  - { id: token.$cacheFactory, shape: token, match: $cacheFactory, class: decision,   target: "a Map in a root service" }
  - { id: token.$sce,          shape: token, match: $sce,          class: mechanical, target: "inject(DomSanitizer)", residue: "$sce: DomSanitizer", rewrite: { inject: { prop: sanitizer, class: DomSanitizer, from: "@angular/platform-browser" } }, angular_min: "14" }
  - { id: token.$sceDelegate,  shape: token, match: $sceDelegate,  class: decision,   target: "DomSanitizer" }
  - { id: token.$controller,   shape: token, match: $controller,   class: decision,   target: "none; the controller is a component" }
  - { id: token.$injector,     shape: token, match: $injector,     class: decision,   target: "inject(Injector)", residue: "$injector: inject() at the use site", rewrite: { note: "inject() at the use site" } }
  - { id: token.$exceptionHandler, shape: token, match: $exceptionHandler, class: decision, target: "ErrorHandler" }
  - { id: token.$animate,      shape: token, match: $animate,      class: decision,   target: "@angular/animations, or AnimationBuilder", rewrite: { note: "@angular/animations" } }
  - { id: token.$animateCss,   shape: token, match: $animateCss,   class: decision,   target: "AnimationBuilder" }
  - { id: token.$locale,       shape: token, match: $locale,       class: decision,   target: "LOCALE_ID and @angular/common formatters" }
  - { id: token.$rootElement,  shape: token, match: $rootElement,  class: decision,   target: "ApplicationRef / DOCUMENT" }
  - { id: token.$browser,      shape: token, match: $browser,      class: decision,   target: "private API; drop" }
  - { id: token.$xhrFactory,   shape: token, match: $xhrFactory,   class: decision,   target: "HttpClient" }
  - { id: token.$jsonpCallbacks, shape: token, match: $jsonpCallbacks, class: decision, target: "HttpClient.jsonp" }
  - { id: token.$$rAF,         shape: token, match: $$rAF,         class: mechanical, target: "requestAnimationFrame" }
  - { id: token.$delegate,     shape: token, match: $delegate,     class: decision,   target: "the decorated class, as a subclass provided in its place" }
  # ngRoute / ui-router / other modules
  - { id: token.$route,        shape: token, match: $route,        class: decision,   target: "Router / ActivatedRoute" }
  - { id: token.$routeParams,  shape: token, match: $routeParams,  class: mechanical, target: "inject(ActivatedRoute); .x reads snapshot.params['x']", rewrite: { inject: { prop: route, class: ActivatedRoute, from: "@angular/router" } }, angular_min: "14" }
  - { id: token.$state,        shape: token, match: $state,        class: note,       target: "inject(Router); the members are decisions", rewrite: { inject: { prop: router, class: Router, from: "@angular/router" } }, angular_min: "14", since: "ui-router" }
  - { id: token.$stateParams,  shape: token, match: $stateParams,  class: mechanical, target: "inject(ActivatedRoute); .x reads snapshot.params['x']", residue: "$stateParams: this.route.snapshot.params", rewrite: { inject: { prop: route, class: ActivatedRoute, from: "@angular/router" } }, angular_min: "14" }
  - { id: token.$transitions,  shape: token, match: $transitions,  class: decision,   target: "Router events, guards and resolvers", since: "1.0 (ui-router 1.x)" }
  - { id: token.$transition$,  shape: token, match: $transition$,  class: decision,   target: "ActivatedRouteSnapshot in a guard or resolver" }
  - { id: token.$uiRouter,     shape: token, match: $uiRouter,     class: decision,   target: "Router" }
  - { id: token.$uiRouterGlobals, shape: token, match: $uiRouterGlobals, class: decision, target: "Router events / ActivatedRoute" }
  - { id: token.$urlRouter,    shape: token, match: $urlRouter,    class: decision,   target: "Router" }
  - { id: token.$urlService,   shape: token, match: $urlService,   class: decision,   target: "Router / Location" }
  - { id: token.$stateRegistry, shape: token, match: $stateRegistry, class: decision, target: "Router.config / resetConfig" }
  - { id: token.$view,         shape: token, match: $view,         class: decision,   target: "router-outlet" }
  - { id: token.$trace,        shape: token, match: $trace,        class: decision,   target: "Router enableTracing" }
  - { id: token.$resolve,      shape: token, match: $resolve,      class: decision,   target: "route resolvers and ActivatedRoute.data" }
  - { id: token.$resource,     shape: token, match: $resource,     class: decision,   target: "HttpClient methods on a service" }
  - { id: token.$sanitize,     shape: token, match: $sanitize,     class: decision,   target: "DomSanitizer.sanitize(SecurityContext.HTML, x)" }
  - { id: token.$cookies,      shape: token, match: $cookies,      class: decision,   target: "document.cookie, or ngx-cookie-service", rewrite: { note: "document.cookie, or a cookie service" } }
  - { id: token.$cookieStore,  shape: token, match: $cookieStore,  class: decision,   target: "document.cookie, or ngx-cookie-service" }
  - { id: token.$swipe,        shape: token, match: $swipe,        class: decision,   target: "pointer events, or HammerJS" }
  - { id: token.$aria,         shape: token, match: $aria,         class: decision,   target: "@angular/cdk/a11y" }
  # providers, in config blocks
  - { id: token.$provide,             shape: token, match: $provide,             class: decision, target: "providers: [...]" }
  - { id: token.$httpProvider,        shape: token, match: $httpProvider,        class: decision, target: "provideHttpClient(withInterceptors([...]))" }
  - { id: token.$locationProvider,    shape: token, match: $locationProvider,    class: decision, target: "provideRouter(...) with withHashLocation() or none" }
  - { id: token.$compileProvider,     shape: token, match: $compileProvider,     class: decision, target: "none; drop, or DomSanitizer settings" }
  - { id: token.$controllerProvider,  shape: token, match: $controllerProvider,  class: decision, target: "none; components are classes" }
  - { id: token.$filterProvider,      shape: token, match: $filterProvider,      class: decision, target: "a @Pipe" }
  - { id: token.$animateProvider,     shape: token, match: $animateProvider,     class: decision, target: "@angular/animations" }
  - { id: token.$interpolateProvider, shape: token, match: $interpolateProvider, class: decision, target: "none; Angular templates use {{ }}" }
  - { id: token.$logProvider,         shape: token, match: $logProvider,         class: decision, target: "isDevMode()" }
  - { id: token.$parseProvider,       shape: token, match: $parseProvider,       class: decision, target: "none" }
  - { id: token.$qProvider,           shape: token, match: $qProvider,           class: decision, target: "none; unhandled rejections are the platform's" }
  - { id: token.$rootScopeProvider,   shape: token, match: $rootScopeProvider,   class: decision, target: "none" }
  - { id: token.$sceProvider,         shape: token, match: $sceProvider,         class: decision, target: "none; sanitization is always on" }
  - { id: token.$sceDelegateProvider, shape: token, match: $sceDelegateProvider, class: decision, target: "DomSanitizer bypass calls where trusted" }
  - { id: token.$templateRequestProvider, shape: token, match: $templateRequestProvider, class: decision, target: "none" }
  - { id: token.$anchorScrollProvider, shape: token, match: $anchorScrollProvider, class: decision, target: "provideRouter(withInMemoryScrolling())" }
  - { id: token.$stateProvider,       shape: token, match: $stateProvider,       class: decision, target: "the Routes array (wire-router writes it)" }
  - { id: token.$urlRouterProvider,   shape: token, match: $urlRouterProvider,   class: decision, target: "the wildcard route / redirectTo" }
  - { id: token.$routeProvider,       shape: token, match: $routeProvider,       class: decision, target: "the Routes array" }
  - { id: token.$urlMatcherFactoryProvider, shape: token, match: $urlMatcherFactoryProvider, class: decision, target: "route matchers" }
  - { id: token.$uiRouterProvider,    shape: token, match: $uiRouterProvider,    class: decision, target: "provideRouter" }
  # ── members on tokens ──────────────────────────────────────────────────
  - { id: member.$q.defer,   shape: member, match: $q.defer,   class: decision,   target: "new Promise((resolve, reject) => …)", residue: "$q.defer: return new Promise((resolve, reject) => …) instead" }
  - { id: member.$q.all,     shape: member, match: $q.all,     class: mechanical, target: "Promise.all", rewrite: { call: "Promise.all" } }
  - { id: member.$q.race,    shape: member, match: $q.race,    class: mechanical, target: "Promise.race", rewrite: { call: "Promise.race" } }
  - { id: member.$q.when,    shape: member, match: $q.when,    class: mechanical, target: "Promise.resolve", rewrite: { call: "Promise.resolve" } }
  - { id: member.$q.resolve, shape: member, match: $q.resolve, class: mechanical, target: "Promise.resolve", rewrite: { call: "Promise.resolve" } }
  - { id: member.$q.reject,  shape: member, match: $q.reject,  class: mechanical, target: "Promise.reject", rewrite: { call: "Promise.reject" } }
  - { id: member.$q.call,    shape: member, match: "$q()",     class: mechanical, target: "new Promise(fn)" }
  - { id: member.$http.get,    shape: member, match: $http.get,    class: note, target: "this.http.get(url, { params }) — an Observable; the callers await via firstValueFrom" }
  - { id: member.$http.post,   shape: member, match: $http.post,   class: note, target: "this.http.post(url, body)" }
  - { id: member.$http.put,    shape: member, match: $http.put,    class: note, target: "this.http.put(url, body)" }
  - { id: member.$http.patch,  shape: member, match: $http.patch,  class: note, target: "this.http.patch(url, body)" }
  - { id: member.$http.delete, shape: member, match: $http.delete, class: note, target: "this.http.delete(url)" }
  - { id: member.$http.head,   shape: member, match: $http.head,   class: note, target: "this.http.head(url)" }
  - { id: member.$http.jsonp,  shape: member, match: $http.jsonp,  class: note, target: "this.http.jsonp(url, callbackParam)", since: "1.0" }
  - { id: member.$http.call,   shape: member, match: "$http()",    class: note, target: "this.http.request(method, url, options)" }
  - { id: member.$http.success, shape: member, match: $http.success, class: decision, target: ".then(r => …) — removed in AngularJS 1.6", until: "1.5" }
  - { id: member.$http.error,   shape: member, match: $http.error,   class: decision, target: ".catch(e => …) — removed in AngularJS 1.6", until: "1.5" }
  - { id: member.$http.defaults, shape: member, match: $http.defaults, class: decision, target: "an interceptor" }
  - { id: member.$http.pendingRequests, shape: member, match: $http.pendingRequests, class: decision, target: "none; track in the caller" }
  - { id: member.$timeout.call,   shape: member, match: "$timeout()",   class: mechanical, target: "setTimeout(fn, ms)", rewrite: { call: "setTimeout" } }
  - { id: member.$timeout.cancel, shape: member, match: $timeout.cancel, class: mechanical, target: "clearTimeout(handle)", rewrite: { call: "clearTimeout" } }
  - { id: member.$interval.call,   shape: member, match: "$interval()",   class: mechanical, target: "setInterval(fn, ms)", rewrite: { call: "setInterval" } }
  - { id: member.$interval.cancel, shape: member, match: $interval.cancel, class: mechanical, target: "clearInterval(handle)", rewrite: { call: "clearInterval" } }
  - { id: member.$log.log,   shape: member, match: $log.log,   class: mechanical, target: "console.log", rewrite: { call: "console.log" } }
  - { id: member.$log.info,  shape: member, match: $log.info,  class: mechanical, target: "console.info", rewrite: { call: "console.info" } }
  - { id: member.$log.warn,  shape: member, match: $log.warn,  class: mechanical, target: "console.warn", rewrite: { call: "console.warn" } }
  - { id: member.$log.error, shape: member, match: $log.error, class: mechanical, target: "console.error", rewrite: { call: "console.error" } }
  - { id: member.$log.debug, shape: member, match: $log.debug, class: mechanical, target: "console.debug", rewrite: { call: "console.debug" } }
  - { id: member.$location.path,     shape: member, match: $location.path,     class: decision, target: "this.router.url (read) / this.router.navigate([...]) (write)", residue: "$location.path: this.router.navigate / this.router.url" }
  - { id: member.$location.url,      shape: member, match: $location.url,      class: decision, target: "this.router.url / this.router.navigateByUrl(url)", residue: "$location.url: this.router.url (read) / this.router.navigateByUrl(url)" }
