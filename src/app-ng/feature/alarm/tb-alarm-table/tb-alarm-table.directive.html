<div flex class="md-content md-padding tb-absolute-fill" layout="column">
    <section layout="row">
        <mat-form-field class="md-block" style="width: 200px;">
            <mat-label>{{ 'alarm.alarm-status' | translate }}</mat-label>
            <mat-select [ngModel]="alarmSearchStatus" (ngModelChange)="onAlarmSearchStatusChange($event)" [disabled]="rootScope.loading">
                @for (searchStatus of alarmSearchStatuses; track searchStatus) {
                <mat-option [value]="searchStatus">
                    {{ ('alarm.search-status.' + searchStatus) | translate }}
                </mat-option>
                }
            </mat-select>
        </mat-form-field>
        <tb-timewindow flex [ngModel]="timewindow" (ngModelChange)="onTimewindowChange($event)" history-only [asButton]="true"></tb-timewindow>
        <button mat-icon-button type="button" [disabled]="rootScope.loading" (click)="reload()"
                matTooltip="{{ 'action.refresh' | translate }}" matTooltipPosition="above">
            <mat-icon>refresh</mat-icon>
        </button>
    </section>
    <div flex layout="column" class="tb-alarm-container md-whiteframe-z1">
        <div flex layout="column" class="tb-alarm-table">
            <div class="tb-row tb-header" layout="row" layout-align="start center" tb-alarm-header>
            </div>
            <mat-progress-bar style="max-height: 0px;" mode="indeterminate" [hidden]="!rootScope.loading"></mat-progress-bar>
            <mat-divider></mat-divider>
            <span layout-align="center center" style="margin-top: 25px;" class="tb-prompt" [hidden]="!noData()">{{ 'alarm.no-alarms-prompt' | translate }}</span>
            <cdk-virtual-scroll-viewport [hidden]="!hasData()" flex [itemSize]="rowHeight" (scrolledIndexChange)="onScrolledIndexChange($event)">
                <div *cdkVirtualFor="let alarm of alarms.data; trackBy: trackByIndex" flex [ngStyle]="hasScroll() ? {'margin-right':'-15px'} : {}">
                    <div class="tb-row" flex layout="row" layout-align="start center" tb-alarm-row [alarm]="alarm">
                    </div>
                    <mat-divider></mat-divider>
                </div>
            </cdk-virtual-scroll-viewport>
        </div>
    </div>
</div>
