<div flex class="md-content md-padding tb-absolute-fill" layout="column">
    <section layout="row">
        <mat-form-field class="md-block" style="width: 200px;">
            <mat-label translate>alarm.alarm-status</mat-label>
            <mat-select [(ngModel)]="alarmSearchStatus" [disabled]="rootScope?.loading">
                @for (searchStatus of types?.alarmSearchStatus; track $index) {
                  <mat-option [value]="searchStatus">
                    {{ ('alarm.search-status.' + searchStatus) | translate }}
                </mat-option>
                }
            </mat-select>
        </mat-form-field>
        <tb-timewindow flex [(ngModel)]="timewindow" history-only [asButton]="true"></tb-timewindow>
        <button mat-icon-button [disabled]="rootScope?.loading" (click)="reload()" attr.matTooltip="{{ 'action.refresh' | translate }}" matTooltipPosition="above">
            <mat-icon>refresh</mat-icon>
            
        </button>
    </section>
    <div flex layout="column" class="tb-alarm-container md-whiteframe-z1">
        <mat-list flex layout="column" class="tb-alarm-table">
            <mat-list class="tb-row tb-header" layout="row" layout-align="start center" tb-alarm-header>
            </mat-list>
            <mat-progress-bar style="max-height: 0px;" mode="indeterminate" [style.visibility]="(!rootScope?.loading) ? 'hidden' : 'visible'" [hidden]="!(rootScope?.loading)"></mat-progress-bar>
            <mat-divider></mat-divider>
            <span translate layout-align="center center" style="margin-top: 25px;" class="tb-prompt" [hidden]="!(noData())">alarm.no-alarms-prompt</span>
            <cdk-virtual-scroll-viewport itemSize="48" [hidden]="!(hasData())" flex tb-scope-element="repeatContainer">
                <mat-list-item *cdkVirtualFor="let alarm of alarms.data" flex [ngStyle]="hasScroll() ? {'margin-right':'-15px'} : {}">
                    <mat-list class="tb-row" flex layout="row" layout-align="start center" tb-alarm-row [alarm]="alarm">
                    </mat-list>
                    <mat-divider flex></mat-divider>
                </mat-list-item>
            </cdk-virtual-scroll-viewport>
        </mat-list>
    </div>
</div>
