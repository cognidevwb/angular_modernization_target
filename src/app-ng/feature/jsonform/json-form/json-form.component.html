<div layout="row" layout-margin style="background-color: white;" class="md-content">

    <div layout="column" flex="45">
        <h3>The Generated Form</h3>
        <form #ngform="ngForm" layout="column" layout-padding>
            <tb-json-form [(schema)]="schema" [(form)]="form" [(model)]="model" [readonly]="isFormReadonly === 'true'" [formControl]="ngform">
            </tb-json-form>
        </form>
        <mat-checkbox [ngModel]="isFormReadonly === 'true'" (ngModelChange)="isFormReadonly = $event ? 'true' : 'false'">Readonly</mat-checkbox>
        <div flex layout="column">
            <div [hidden]="!ngform.valid"><em>Form is valid</em></div>
            <div [hidden]="!ngform.invalid"><em>Form is not valid</em></div>
            <div [hidden]="!ngform.dirty"><em>Form is dirty</em></div>
            <h3>Model</h3>
            <button mat-button type="button" (click)="resetModel()">Reset model</button>
            <pre>{{pretty()}}</pre>
        </div>
    </div>

    <div layout="column" flex>
        <h3>Form</h3>
        <div [ui-ace]="aceJsonOptions" [ngClass]="{red: !itParsesForm}" [(ngModel)]="formJson" class="form-control form"></div>
        <h3>Schema</h3>
        <div [ui-ace]="aceJsonOptions" [ngClass]="{red: !itParses}" [(ngModel)]="schemaJson" class="form-control schema"></div>

    </div>

</div>
