<tb-grid [config]="deviceGridConfig" [itemCardComponent]="deviceCard" [addItemComponent]="addDeviceDialog">
    <div details-buttons>
        <tb-grid-help helpId="devices"></tb-grid-help>
    </div>
    @if (grid && grid.operatingItem(); as device) {
      <mat-tab-group [ngClass]="{'tb-headless': grid.detailsConfig.isDetailsEditMode}" id="tabs" flex class="tb-absolute-fill" (selectedTabChange)="grid.triggerResize()">
        <mat-tab [label]="'device.details' | translate">
            <tb-device [device]="device" [(isEdit)]="grid.detailsConfig.isDetailsEditMode" [deviceScope]="devicesScope" [theForm]="grid.detailsForm" (onAssignToCustomer)="assignToCustomer($event.event, [grid.detailsConfig.currentItem.id.id])" (onMakePublic)="makePublic($event.event, grid.detailsConfig.currentItem)" (onUnassignFromCustomer)="unassignFromCustomer($event.event, grid.detailsConfig.currentItem, $event.isPublic)" (onManageCredentials)="manageCredentials($event.event, grid.detailsConfig.currentItem)" (onDeleteDevice)="grid.deleteItem($event.event, grid.detailsConfig.currentItem)"></tb-device>
        </mat-tab>
        @if (!grid.detailsConfig.isDetailsEditMode) {
          <mat-tab [label]="'attribute.attributes' | translate">
            <tb-attribute-table flex [entityId]="device.id?.id" [entityType]="types.entityType.device" [entityName]="device.name" [defaultAttributeScope]="types.attributesScope.client.value"></tb-attribute-table>
          </mat-tab>
          <mat-tab [label]="'attribute.latest-telemetry' | translate">
            <tb-attribute-table flex [entityId]="device.id?.id" [entityType]="types.entityType.device" [entityName]="device.name" [defaultAttributeScope]="types.latestTelemetry.value" [disableAttributeScopeSelection]="true"></tb-attribute-table>
          </mat-tab>
          <mat-tab [label]="'alarm.alarms' | translate">
            <tb-alarm-table flex [entityType]="types.entityType.device" [entityId]="device.id?.id"></tb-alarm-table>
          </mat-tab>
          <mat-tab [label]="'device.events' | translate">
            <tb-event-table flex [entityType]="types.entityType.device" [entityId]="device.id?.id" [tenantId]="device.tenantId?.id" [attr.default-event-type]="types.eventType.error.value"></tb-event-table>
          </mat-tab>
          <mat-tab [label]="'relation.relations' | translate">
            <tb-relation-table flex [entityId]="device.id?.id" [entityType]="types.entityType.device"></tb-relation-table>
          </mat-tab>
          @if (device.additionalInfo?.gateway) {
            <mat-tab [label]="'extension.extensions' | translate">
              <tb-extension-table flex [entityId]="device.id?.id" [entityName]="device.name" [entityType]="types.entityType.device"></tb-extension-table>
            </mat-tab>
          }
          @if (grid.isTenantAdmin()) {
            <mat-tab [label]="'audit-log.audit-logs' | translate">
              <tb-audit-log-table flex [entityType]="types.entityType.device" [entityId]="device.id?.id" [auditLogMode]="types.auditLogMode.entity"></tb-audit-log-table>
            </mat-tab>
          }
        }
      </mat-tab-group>
    }
</tb-grid>
