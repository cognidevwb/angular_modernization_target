<button mat-raised-button color="primary" type="button" (click)="onMakePublic.emit({event: $event})" [hidden]="!(!isEdit() && assetScope() === 'tenant' && !isAssignedToCustomer && !isPublic)">{{ 'asset.make-public' | translate }}</button>
<button mat-raised-button color="primary" type="button" (click)="onAssignToCustomer.emit({event: $event})" [hidden]="!(!isEdit() && assetScope() === 'tenant' && !isAssignedToCustomer)">{{ 'asset.assign-to-customer' | translate }}</button>
<button mat-raised-button color="primary" type="button" (click)="onUnassignFromCustomer.emit({event: $event, isPublic: isPublic})" [hidden]="!(!isEdit() && (assetScope() === 'customer' || assetScope() === 'tenant') && isAssignedToCustomer)">{{ (isPublic ? 'asset.make-private' : 'asset.unassign-from-customer') | translate }}</button>
<button mat-raised-button color="primary" type="button" (click)="onDeleteAsset.emit({event: $event})" [hidden]="!(!isEdit() && assetScope() === 'tenant')">{{ 'asset.delete' | translate }}</button>

<div layout="row">
    <button mat-raised-button type="button" (click)="copyAssetId($event)" [hidden]="!(!isEdit())">
        <mat-icon svgIcon="mdi:clipboard-arrow-left"></mat-icon>
        <span>{{ 'asset.copyId' | translate }}</span>
    </button>
</div>

<div class="md-content md-padding" layout="column">
    <mat-form-field class="md-block" [hidden]="!(!isEdit() && isAssignedToCustomer && !isPublic && assetScope() === 'tenant')">
        <mat-label>{{ 'asset.assignedToCustomer' | translate }}</mat-label>
        <input matInput [value]="assignedCustomer?.title ?? ''" disabled>
    </mat-form-field>
    <div class="tb-small" style="padding-bottom: 10px; padding-left: 2px;" [hidden]="!(!isEdit() && isPublic && (assetScope() === 'customer' || assetScope() === 'tenant'))">
        {{ 'asset.asset-public' | translate }}
    </div>
    @if (asset(); as a) {
      <fieldset [disabled]="rootScope.loading || !isEdit()">
        <mat-form-field class="md-block">
            <mat-label>{{ 'asset.name' | translate }}</mat-label>
            <input matInput required name="name" [(ngModel)]="a.name" #name="ngModel">
            @if (name.errors?.['required']) {
              <mat-error>{{ 'asset.name-required' | translate }}</mat-error>
            }
        </mat-form-field>
        <tb-entity-subtype-autocomplete name="type" [ngDisabled]="rootScope.loading || !isEdit()" [tbRequired]="true" [theForm]="theForm()" [(ngModel)]="a.type" [entityType]="types.entityType.asset">
        </tb-entity-subtype-autocomplete>
        <mat-form-field class="md-block">
            <mat-label>{{ 'asset.label' | translate }}</mat-label>
            <input matInput name="label" [(ngModel)]="a.label">
        </mat-form-field>
        <mat-form-field class="md-block">
            <mat-label>{{ 'asset.description' | translate }}</mat-label>
            <textarea matInput name="description" [ngModel]="a.additionalInfo?.description" (ngModelChange)="setAdditionalInfo(a, 'description', $event)" rows="2"></textarea>
        </mat-form-field>
      </fieldset>
    }
</div>
