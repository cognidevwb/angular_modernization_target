<button mat-raised-button color="primary" (click)="onMakePublic.emit({event: $event})" [hidden]="!(!isEdit() && assetScope() === 'tenant' && !isAssignedToCustomer && !isPublic)">{{ 'asset.make-public' | translate }}</button>
<button mat-raised-button color="primary" (click)="onAssignToCustomer.emit({event: $event})" [hidden]="!(!isEdit() && assetScope() === 'tenant' && !isAssignedToCustomer)">{{ 'asset.assign-to-customer' | translate }}</button>
<button mat-raised-button color="primary" (click)="onUnassignFromCustomer.emit({event: $event, isPublic: isPublic})" [hidden]="!(!isEdit() && (assetScope() === 'customer' || assetScope() === 'tenant') && isAssignedToCustomer)">{{ isPublic ? 'asset.make-private' : 'asset.unassign-from-customer' | translate }}</button>
<button mat-raised-button color="primary" (click)="onDeleteAsset.emit({event: $event})" [hidden]="!(!isEdit() && assetScope() === 'tenant')">{{ 'asset.delete' | translate }}</button>

<div layout="row">
    <button mat-raised-button ngclipboard data-clipboard-action="copy" ngclipboard-success="onAssetIdCopied(e)" attr.data-clipboard-text="{{asset()?.id?.id}}" [hidden]="!(!isEdit())">
        <mat-icon svgIcon="mdi:clipboard-arrow-left"></mat-icon>
        <span translate>asset.copyId</span>
    </button>
</div>

<div class="md-content md-padding" layout="column">
    <mat-form-field class="md-block" [hidden]="!(!isEdit() && isAssignedToCustomer && !isPublic && assetScope() === 'tenant')">
        <mat-label translate>asset.assignedToCustomer</mat-label>
        <input matInput [(ngModel)]="assignedCustomer.title" disabled>
    </mat-form-field>
    <div class="tb-small" style="padding-bottom: 10px; padding-left: 2px;" [hidden]="!(!isEdit() && isPublic && (assetScope() === 'customer' || assetScope() === 'tenant'))">
        {{ 'asset.asset-public' | translate }}
    </div>
    <fieldset [disabled]="rootScope?.loading || !isEdit()">
        <mat-form-field class="md-block">
            <mat-label translate>asset.name</mat-label>
            <input matInput required name="name" [ngModel]="asset().name" (ngModelChange)="asset().name = $event">
            <!-- TODO(port): ng-messages has no one-to-one Angular form -->
            <div ng-messages="theForm()?.name?.$error">
                <!-- TODO(port): ng-message has no one-to-one Angular form -->
                <div translate ng-message="required">asset.name-required</div>
            </div>
        </mat-form-field>
        <tb-entity-subtype-autocomplete [ngDisabled]="rootScope?.loading || !isEdit()" [tbRequired]="true" [(theForm)]="theForm" [ngModel]="asset().type" (ngModelChange)="asset().type = $event" [(entityType)]="types.entityType.asset">
        </tb-entity-subtype-autocomplete>
        <mat-form-field class="md-block">
            <mat-label translate>asset.label</mat-label>
            <input matInput name="label" [ngModel]="asset().label" (ngModelChange)="asset().label = $event">
        </mat-form-field>
        <mat-form-field class="md-block">
            <mat-label translate>asset.description</mat-label>
            <textarea matInput [ngModel]="asset().additionalInfo.description" (ngModelChange)="asset().additionalInfo.description = $event" rows="2"></textarea>
        </mat-form-field>
    </fieldset>
</div>
