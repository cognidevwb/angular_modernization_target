<tb-grid [config]="assetGridConfig" [itemCardComponent]="assetCard" [addItemComponent]="addAssetDialog">
    <div details-buttons>
        <tb-grid-help helpId="assets"></tb-grid-help>
    </div>
    @if (grid && grid.operatingItem(); as asset) {
      <mat-tab-group [ngClass]="{'tb-headless': grid.detailsConfig.isDetailsEditMode}" id="tabs" flex class="tb-absolute-fill" (selectedTabChange)="grid.triggerResize()">
        <mat-tab [label]="'asset.details' | translate">
            <tb-asset [asset]="asset" [(isEdit)]="grid.detailsConfig.isDetailsEditMode" [assetScope]="assetsScope" [theForm]="grid.detailsForm" (onAssignToCustomer)="assignToCustomer($event.event, [grid.detailsConfig.currentItem.id.id])" (onMakePublic)="makePublic($event.event, grid.detailsConfig.currentItem)" (onUnassignFromCustomer)="unassignFromCustomer($event.event, grid.detailsConfig.currentItem, $event.isPublic)" (onDeleteAsset)="grid.deleteItem($event.event, grid.detailsConfig.currentItem)"></tb-asset>
        </mat-tab>
        @if (!grid.detailsConfig.isDetailsEditMode) {
          <mat-tab [label]="'attribute.attributes' | translate">
            <tb-attribute-table flex [entityId]="asset.id?.id" [entityType]="types.entityType.asset" [entityName]="asset.name" [defaultAttributeScope]="types.attributesScope.server.value"></tb-attribute-table>
          </mat-tab>
          <mat-tab [label]="'attribute.latest-telemetry' | translate">
            <tb-attribute-table flex [entityId]="asset.id?.id" [entityType]="types.entityType.asset" [entityName]="asset.name" [defaultAttributeScope]="types.latestTelemetry.value" [disableAttributeScopeSelection]="true"></tb-attribute-table>
          </mat-tab>
          <mat-tab [label]="'alarm.alarms' | translate">
            <tb-alarm-table flex [entityType]="types.entityType.asset" [entityId]="asset.id?.id"></tb-alarm-table>
          </mat-tab>
          <mat-tab [label]="'asset.events' | translate">
            <tb-event-table flex [entityType]="types.entityType.asset" [entityId]="asset.id?.id" [tenantId]="asset.tenantId?.id" [attr.default-event-type]="types.eventType.error.value"></tb-event-table>
          </mat-tab>
          <mat-tab [label]="'relation.relations' | translate">
            <tb-relation-table flex [entityId]="asset.id?.id" [entityType]="types.entityType.asset"></tb-relation-table>
          </mat-tab>
          @if (grid.isTenantAdmin()) {
            <mat-tab [label]="'audit-log.audit-logs' | translate">
              <tb-audit-log-table flex [entityType]="types.entityType.asset" [entityId]="asset.id?.id" [auditLogMode]="types.auditLogMode.entity"></tb-audit-log-table>
            </mat-tab>
          }
        }
      </mat-tab-group>
    }
</tb-grid>
