<section [hidden]="!(!rootScope?.loading && noData())" layout-align="center center" style="text-transform: uppercase; display: flex; z-index: 1;" class="md-headline tb-absolute-fill">
	 @if (!isReadOnly()) {
	   <button mat-button class="tb-add-new-widget" (click)="addWidgetType($event)">
	 	 <mat-icon attr.aria-label="{{ 'action.add' | translate }}" class="material-icons tb-md-96">add</mat-icon>
	 	 {{ 'widget.add-widget-type' | translate }}
	 </button>
	 }
	 @if (isReadOnly()) {
	   <span translate layout-align="center center" style="text-transform: uppercase; display: flex;" class="md-headline tb-absolute-fill">widgets-bundle.empty</span>
	 }
</section>
<tb-dashboard [(aliasController)]="aliasController" [(widgets)]="widgetTypes" [isEdit]="false" [isEditActionEnabled]="true" [isExportActionEnabled]="true" [isRemoveActionEnabled]="!isReadOnly()" (onEditWidget)="openWidgetType($event.event, $event.widget)" (onExportWidget)="exportWidgetType($event.event, $event.widget)" (onRemoveWidget)="removeWidgetType($event.event, $event.widget)" (loadWidgets)="loadWidgetLibrary()" (onInit)="dashboardInited($event.dashboard)" (onInitFailed)="dashboardInitFailed($event.e)">
</tb-dashboard>
<section layout="row" layout-wrap class="tb-footer-buttons md-fab ">
	<div [hidden]="!(!isReadOnly())" class="md-scale">
		<button mat-fab color="accent" [disabled]="rootScope?.loading" class="tb-btn-footer md-hue-2" (click)="addItemActionsOpen = !addItemActionsOpen" attr.aria-label="{{ 'widget.add-widget-type' | translate }}" attr.matTooltip="{{ 'widget.add-widget-type' | translate }}" matTooltipPosition="above">
			
			<mat-icon>add</mat-icon>
		</button>
		<div [hidden]="!addItemActionsOpen">
			<button mat-fab [disabled]="rootScope?.loading" class="tmd-accent md-hue-2" (click)="addWidgetType($event)" attr.aria-label="{{ 'action.create' | translate }}" attr.matTooltip="{{ 'widget-type.create-new-widget-type' | translate }}" matTooltipPosition="above">
				
				<mat-icon>insert_drive_file</mat-icon>
			</button>
			<button mat-fab [disabled]="rootScope?.loading" class="tmd-accent md-hue-2" (click)="importWidgetType($event)" attr.aria-label="{{ 'action.import' | translate }}" attr.matTooltip="{{ 'widget-type.import' | translate }}" matTooltipPosition="above">
				
				<mat-icon>file_upload</mat-icon>
			</button>
		</div>
	</div>
</section>
