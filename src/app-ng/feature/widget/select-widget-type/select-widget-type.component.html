<div style="width: 800px;" attr.aria-label="{{ 'widget.select-widget-type' | translate }}" class="md-dialog">
    <form name="theForm">
        <mat-toolbar>
            <div class="md-toolbar-tools">
                <h2>{{ 'widget.select-widget-type' | translate }}</h2>
                <span flex></span>
                <button mat-icon-button (click)="cancel()">
                    <mat-icon attr.aria-label="{{ 'dialog.close' | translate }}">close</mat-icon>
                </button>
            </div>
        </mat-toolbar>
        <mat-progress-bar color="warn" mode="indeterminate" [style.visibility]="(!rootScope?.loading) ? 'hidden' : 'visible'" [hidden]="!(rootScope?.loading)"></mat-progress-bar>
        <span style="min-height: 5px;" flex="" [hidden]="!(!rootScope?.loading)"></span>
        <mat-dialog-content>
            <div class="md-dialog-content">
                <fieldset [disabled]="rootScope?.loading">
                    <div layout="column" layout-gt-sm="row" layout-align="center center">
                        <button mat-raised-button color="primary" class="tb-card-button" layout="column" (click)="typeSelected(types.widgetType.timeseries.value)">
                            <mat-icon class="material-icons tb-md-96" attr.aria-label="{{ types?.widgetType?.timeseries?.name | translate }}">
                                timeline
                            </mat-icon>
                            <span>{{ (types?.widgetType?.timeseries?.name) | translate }}</span>
                        </button>
                        <button mat-raised-button color="primary" class="tb-card-button" layout="column" (click)="typeSelected(types.widgetType.latest.value)">
                            <mat-icon class="material-icons tb-md-96" attr.aria-label="{{ types?.widgetType?.latest?.name | translate }}">track_changes
                            </mat-icon>
                            <span>{{ (types?.widgetType?.latest?.name) | translate }}</span>
                        </button>
                        <button mat-raised-button color="primary" class="tb-card-button" layout="column" (click)="typeSelected(types.widgetType.rpc.value)">
                            <mat-icon class="material-icons tb-md-96" attr.aria-label="{{ types?.widgetType?.rpc?.name | translate }}" svgIcon="mdi:developer-board">
                            </mat-icon>
                            <span>{{ (types?.widgetType?.rpc?.name) | translate }}</span>
                        </button>
                        <button mat-raised-button color="primary" class="tb-card-button" layout="column" (click)="typeSelected(types.widgetType.alarm.value)">
                            <mat-icon class="material-icons tb-md-96" attr.aria-label="{{ types?.widgetType?.alarm?.name | translate }}">error
                            </mat-icon>
                            <span>{{ (types?.widgetType?.alarm?.name) | translate }}</span>
                        </button>
                        <button mat-raised-button color="primary" class="tb-card-button" layout="column" (click)="typeSelected(types.widgetType.static.value)">
                            <mat-icon class="material-icons tb-md-96" attr.aria-label="{{ types?.widgetType?.static?.name | translate }}">font_download
                            </mat-icon>
                            <span>{{ (types?.widgetType?.static?.name) | translate }}</span>
                        </button>
                    </div>
                </fieldset>
            </div>
        </mat-dialog-content>
        <mat-dialog-actions layout="row">
            <span flex></span>
            <button mat-button [disabled]="rootScope?.loading" (click)="cancel()" style="margin-right:20px;">{{ 'action.cancel' |
                translate }}
            </button>
        </mat-dialog-actions>
    </form>
</div>
