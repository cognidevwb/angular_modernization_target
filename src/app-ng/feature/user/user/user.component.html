<tb-grid [config]="userGridConfig" [itemCardComponent]="userCard" [addItemComponent]="addUserDialog">
	<div details-buttons>
		<tb-grid-help helpId="users"></tb-grid-help>
	</div>
	@if (grid && grid.operatingItem(); as user) {
	  <mat-tab-group [ngClass]="{'tb-headless': grid.detailsConfig.isDetailsEditMode}" id="tabs" flex class="tb-absolute-fill" (selectedTabChange)="grid.triggerResize()">
		<mat-tab [label]="'user.details' | translate">
			<tb-user [user]="user" [(isEdit)]="grid.detailsConfig.isDetailsEditMode" [theForm]="grid.detailsForm" (onDisplayActivationLink)="displayActivationLink($event.event, grid.detailsConfig.currentItem)" (onResendActivation)="resendActivation(grid.detailsConfig.currentItem)" (onLoginAsUser)="loginAsUser(grid.detailsConfig.currentItem)" (onDeleteUser)="grid.deleteItem($event.event, grid.detailsConfig.currentItem)" (onSetUserCredentialsEnabled)="setUserCredentialsEnabled(grid.detailsConfig.currentItem, $event.userCredentialsEnabled)"></tb-user>
		</mat-tab>
		@if (!grid.detailsConfig.isDetailsEditMode && grid.isTenantAdmin()) {
		  <mat-tab [label]="'audit-log.audit-logs' | translate">
			<tb-audit-log-table flex [userId]="user.id?.id" [auditLogMode]="types.auditLogMode.user"></tb-audit-log-table>
		  </mat-tab>
		}
	  </mat-tab-group>
	}
</tb-grid>
