<div attr.aria-label="{{ 'user.activation-link' | translate }}" style="min-width: 400px;" class="md-dialog">
    <form>
        <mat-toolbar>
            <div class="md-toolbar-tools">
                <h2 translate="user.activation-link"></h2>
                <span flex></span>
                <button mat-icon-button (click)="close()">
                    <mat-icon attr.aria-label="{{ 'dialog.close' | translate }}">close</mat-icon>
                </button>
            </div>
        </mat-toolbar>
        <mat-dialog-content>
            <div id="activation-link-dialog-content" class="md-dialog-content">
                <div class="md-content md-padding" layout="column">
                    <span translate="user.activation-link-text" translate-values="{activationLink: vm.activationLink}"></span>
                    <div layout="row" layout-align="start center">
                        <pre class="tb-highlight" flex><code>{{ activationLink }}</code></pre>
                        <button mat-icon-button ngclipboard attr.data-clipboard-text="{{ activationLink }}" ngclipboard-success="vm.onActivationLinkCopied(e)" attr.matTooltip="{{ 'user.copy-activation-link' | translate }}" matTooltipPosition="above">
                            <mat-icon svgIcon="mdi:clipboard-arrow-left"></mat-icon>
                            
                        </button>
                    </div>
                </div>
            </div>
        </mat-dialog-content>
        <mat-dialog-actions layout="row">
            <span flex></span>
            <button mat-button (click)="close()">{{ 'action.ok' |
                translate }}
            </button>
        </mat-dialog-actions>
    </form>
</div>
