<div class="tb-table-select">
    <table mat-table [dataSource]="columns() ?? []">
        <ng-container matColumnDef="index">
            <th mat-header-cell *matHeaderCellDef>&nbsp</th>
            <td mat-cell *matCellDef="let column; let i = index">{{i + 1}}</td>
        </ng-container>
        <ng-container matColumnDef="sampleData">
            <th mat-header-cell *matHeaderCellDef>{{ 'import.column-example' | translate }}</th>
            <td mat-cell *matCellDef="let column">{{column?.sampleData}}</td>
        </ng-container>
        <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef>{{ 'import.column-type.column-type' | translate }}</th>
            <td mat-cell *matCellDef="let column">
                <mat-select [(ngModel)]="column.type" required name="columnType" attr.aria-label="{{ 'import.column-type.column-type' | translate }}">
                    @for (type of columnTypes; track $index) {
                      <mat-option [value]="type?.value" [disabled]="type?.disable">
                        {{type?.name | translate}}
                    </mat-option>
                    }
                </mat-select>
            </td>
        </ng-container>
        <ng-container matColumnDef="key">
            <th mat-header-cell *matHeaderCellDef>{{ 'import.column-key' | translate }}</th>
            <td mat-cell *matCellDef="let column">
                @if (isColumnTypeDiffers(column?.type)) {
                  <mat-form-field>
                    <input matInput required name="columnKeyName" attr.placeholder="{{ 'import.column-value' | translate }}" [(ngModel)]="column.key" attr.aria-label="{{ 'import.column-value' | translate }}">
                </mat-form-field>
                }
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-divider></mat-divider>
</div>
