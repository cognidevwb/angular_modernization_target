<!-- TODO(port): ng-form has no one-to-one Angular form -->
<div class="tb-manage-widget-actions md-whiteframe-z1 toolbarsContainer" layout="column">
    <mat-toolbar class="md-table-toolbar md-default" [hidden]="!(query?.search === null)">
        <div class="md-toolbar-tools">
            <span translate>widget-config.actions</span>
            <span flex></span>
            <button mat-icon-button (click)="addAction($event)" attr.matTooltip="{{ 'widget-config.add-action' | translate }}" matTooltipPosition="above">
                <mat-icon>add</mat-icon>
            </button>
            <button mat-icon-button (click)="enterFilterMode($event)" attr.matTooltip="{{ 'action.search' | translate }}" matTooltipPosition="above">
                <mat-icon>search</mat-icon>
            </button>
        </div>
    </mat-toolbar>
    <mat-toolbar class="md-table-toolbar md-default" [hidden]="!(query?.search != null)">
        <div class="md-toolbar-tools">
            <button mat-icon-button attr.aria-label="{{ 'action.search' | translate }}" attr.matTooltip="{{ 'widget-config.search-actions' | translate }}" matTooltipPosition="above">
                <mat-icon attr.aria-label="{{ 'action.search' | translate }}" class="material-icons">search</mat-icon>
            </button>
            <mat-form-field flex>
                <mat-label>&nbsp;</mat-label>
                <input matInput [(ngModel)]="query.search" class="searchInput" name="querySearchInput" attr.placeholder="{{ 'widget-config.search-actions' | translate }}">
            </mat-form-field>
            <button mat-icon-button aria-label="Close" (click)="exitFilterMode()" attr.matTooltip="{{ 'action.close' | translate }}" matTooltipPosition="above">
                <mat-icon aria-label="Close" class="material-icons">close</mat-icon>
            </button>
        </div>
    </mat-toolbar>
    <!-- TODO(port): md-table-container (angular-material-data-table) ported to mat-table with MatSort -->
    <table mat-table [dataSource]="actions" matSort (matSortChange)="onSortChange($event)" class="mat-elevation-z1">
        <ng-container matColumnDef="actionSourceName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="actionSourceName"><span translate>widget-config.action-source</span></th>
            <td mat-cell *matCellDef="let action">{{action?.actionSourceName}}</td>
        </ng-container>
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="name"><span translate>widget-config.action-name</span></th>
            <td mat-cell *matCellDef="let action">{{action?.name}}</td>
        </ng-container>
        <ng-container matColumnDef="icon">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="icon"><span translate>widget-config.action-icon</span></th>
            <td mat-cell *matCellDef="let action">
                <mat-icon attr.aria-label="{{ 'widget-config.action-icon' | translate }}" class="material-icons">{{action?.icon}}</mat-icon>
            </td>
        </ng-container>
        <ng-container matColumnDef="typeName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="typeName"><span translate>widget-config.action-type</span></th>
            <td mat-cell *matCellDef="let action">{{action?.typeName}}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef><span>&nbsp</span></th>
            <td mat-cell *matCellDef="let action" class="tb-action-cell">
                <button mat-icon-button attr.aria-label="{{ 'action.edit' | translate }}" (click)="editAction($event, action)" attr.matTooltip="{{ 'widget-config.edit-action' | translate }}" matTooltipPosition="above">
                    <mat-icon attr.aria-label="{{ 'action.edit' | translate }}" class="material-icons">edit</mat-icon>
                </button>
                <button mat-icon-button attr.aria-label="{{'action.delete' | translate}}" (click)="deleteAction($event, action)" attr.matTooltip="{{ 'widget-config.delete-action' | translate }}" matTooltipPosition="above">
                    <mat-icon aria-label="Delete" class="material-icons">delete</mat-icon>
                </button>
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <!-- TODO(port): md-table-pagination ported to mat-paginator -->
    <mat-paginator [length]="actionsCount" [pageIndex]="query.page - 1" [pageSize]="query.limit" [pageSizeOptions]="[10, 15, 20]" (page)="onPaginate($event)">
    </mat-paginator>
</div>
