<mat-form-field class="md-block">
	<mat-label translate>contact.country</mat-label>
    <mat-select [disabled]="!isEdit()" name="country" [ngModel]="contact().country" (ngModelChange)="contact().country = $event">
       @for (country of countries; track $index) {
         <mat-option value="{{country}}">
         {{country}}
       </mat-option>
       }
    </mat-select>
</mat-form-field>	
<div layout-gt-sm="row">
	<mat-form-field class="md-block">
		<mat-label translate>contact.city</mat-label>
		<input matInput name="city" [ngModel]="contact().city" (ngModelChange)="contact().city = $event">	
	</mat-form-field>					
	<mat-form-field class="md-block">
		<mat-label translate>contact.state</mat-label>
		<input matInput name="state" [ngModel]="contact().state" (ngModelChange)="contact().state = $event">	
	</mat-form-field>					
	<mat-form-field class="md-block">
		<mat-label translate>contact.postal-code</mat-label>
		<input matInput name="zip" [ngModel]="contact().zip" (ngModelChange)="contact().zip = $event" [pattern]="postalCodePatterns?.[contact()?.country]">
	    <!-- TODO(port): ng-messages has no one-to-one Angular form -->
	    <div ng-messages="theForm()?.zip?.$error" role="alert" multiple>
	      <!-- TODO(port): ng-message has no one-to-one Angular form -->
	      <div translate ng-message="pattern">contact.postal-code-invalid</div>
	    </div>	
	</mat-form-field>
</div>				
<mat-form-field class="md-block">
	<mat-label translate>contact.address</mat-label>
	<input matInput name="address" [ngModel]="contact().address" (ngModelChange)="contact().address = $event">	
</mat-form-field>					
<mat-form-field class="md-block">
	<mat-label translate>contact.address2</mat-label>
	<input matInput name="address2" [ngModel]="contact().address2" (ngModelChange)="contact().address2 = $event">	
</mat-form-field>					
<mat-form-field class="md-block">
	<mat-label translate>contact.phone</mat-label>
	<input matInput name="phone" [ngModel]="contact().phone" (ngModelChange)="contact().phone = $event">	
</mat-form-field>					
<mat-form-field class="md-block">
	<mat-label translate>contact.email</mat-label>
	<!-- TODO(port): expression not parsed: `/^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\_\-0-9]+\.)+[a-zA-Z]{2,}))$/` -->
	<input matInput name="email" type="text" [pattern]='/^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\_\-0-9]+\.)+[a-zA-Z]{2,}))$/' [ngModel]="contact().email" (ngModelChange)="contact().email = $event">
</mat-form-field>
