<div style="background: #fff;" [ngClass]="{'tb-disabled': disabled(), 'fill-height': fillHeight()}" tbExpandFullscreen (fullscreenZindex)="100" expand-button-id="expand-button" (onFullscreenChanged)="onFullscreenChanged()">
	<div layout="row" layout-align="start center" style="height: 40px;" class="tb-js-func-toolbar">
		<label class="tb-title no-padding">function {{ functionName }}({{ functionArgsString }}) &#123;</label>
		<span flex></span>
		@if (!disabled()) {
		  <button mat-button class="tidy" attr.aria-label="{{ 'js-func.tidy' | translate }}" (click)="beautifyJs()">{{
			'js-func.tidy' | translate }}
		</button>
		}
		<div id="expand-button" layout="column" aria-label="Fullscreen" class="md-button md-icon-button tb-md-32 tb-fullscreen-button-style"></div>
	</div>
	<div id="tb-javascript-panel" class="tb-js-func-panel">
		<div id="tb-javascript-input" [ngClass]="{'fill-height': fillHeight()}" ui-ace="jsEditorOptions" [attr.readonly]="disabled() ? '' : null" [(ngModel)]="functionBody">
		</div>
	</div>
	<div layout="row" layout-align="start center" style="height: 40px;">
		<label class="tb-title no-padding">&#125;</label>
	</div>
</div>
