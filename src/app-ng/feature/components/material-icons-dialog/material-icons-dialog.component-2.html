<div class="md-dialog tb-material-icons-dialog" attr.aria-label="{{'icon.material-icons' | translate }}" style="min-width: 600px;">
    <form>
        <mat-toolbar>
            <div class="md-toolbar-tools">
                <h2>{{ 'icon.select-icon' | translate }}</h2>
                <span flex></span>
                <section layout="row" layout-align="start center">
                    <mat-slide-toggle [(ngModel)]="showAll" attr.aria-label="{{ 'icon.show-all' | translate }}">
                    </mat-slide-toggle>
                    <label translate>icon.show-all</label>
                </section>
                <button mat-icon-button (click)="cancel()">
                    <mat-icon attr.aria-label="{{ 'action.close' | translate }}">close</mat-icon>
                </button>
            </div>
        </mat-toolbar>
        <mat-progress-bar color="warn" mode="indeterminate" [style.visibility]="(!rootScope?.loading) ? 'hidden' : 'visible'" [hidden]="!(rootScope?.loading)"></mat-progress-bar>
        <span style="min-height: 5px;" flex="" [hidden]="!(!rootScope?.loading)"></span>
        <div class="tb-absolute-fill tb-icons-load" [hidden]="!(loadingIcons)" layout="column" layout-align="center center">
            <mat-progress-spinner color="accent" mode="indeterminate" [style.visibility]="(!loadingIcons) ? 'hidden' : 'visible'" diameter="40"></mat-progress-spinner>
        </div>
        <mat-dialog-content>
            <div class="md-dialog-content">
                <div class="md-content md-padding" layout="column">
                    <fieldset [disabled]="rootScope?.loading">
                        @for (icon of icons; track $index) {
                          <button mat-icon-button [ngClass]="{'md-primary md-raised': icon == selectedIcon}" class="tb-select-icon-button" (click)="selectIcon($event, icon)" tb-on-finish-render="iconsLoadFinished" attr.matTooltip="{{ icon }}" matTooltipPosition="below">
                            <mat-icon class="material-icons">{{icon}}</mat-icon>
                            
                        </button>
                        }
                    </fieldset>
                </div>
            </div>
        </mat-dialog-content>
        <mat-dialog-actions layout="row">
            <span flex></span>
            <button mat-button [disabled]="rootScope?.loading" (click)="cancel()">
                {{ 'action.cancel' | translate }}
            </button>
        </mat-dialog-actions>
    </form>
</div>
