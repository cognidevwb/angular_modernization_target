<section name="gatewayConfig" layout="column" class="gateway-config">
    @for (connector of gatewayConfig(); track $index) {
      <section layout="row">
        <div layout="column" layout-align="center start" class="gateway-config-row">
            <mat-slide-toggle [disabled]="isReadOnly() || validateJSON(connector.config)" [(ngModel)]="connector.enabled" attr.aria-label="{{ 'gateway.connector-enabled' | translate }}">
            </mat-slide-toggle>
        </div>
        <div layout="row" flex class="gateway-config-row" [ngClass]="{'gateway-config-row-vertical': changeAlignment()}">
            <mat-form-field class="md-block" flex>
                <mat-label>{{'gateway.connector-type' | translate }}</mat-label>
                <mat-select [disabled]="isReadOnly()" name="connectorType" (ngModelChange)="changeConnectorType(connector)" attr.aria-label="{{ 'gateway.gateway.connector-type' | translate }}" [(ngModel)]="connector.configType" required>
                    @for (configType of types?.gatewayConfigType; track $index) {
                      <mat-option [value]="configType?.value">
                        {{configType?.value}}
                    </mat-option>
                    }
                </mat-select>
                <!-- TODO(port): ng-messages has no one-to-one Angular form -->
                <div ng-messages="theForm()?.connectorType?.$error">
                    <!-- TODO(port): ng-message has no one-to-one Angular form -->
                    <div ng-message="required" translate>gateway.connector-type-required</div>
                </div>
            </mat-form-field>
            <mat-form-field class="md-block" flex>
                <!-- TODO(port): ng-model-options has no one-to-one Angular form -->
                <input matInput [disabled]="isReadOnly()" attr.placeholder="{{'gateway.connector-name' | translate }}" ng-model-options="{ updateOn: 'blur' }" (ngModelChange)="changeConnectorName(connector, $index)" name="connectorName" [(ngModel)]="connector.name" required>
                <!-- TODO(port): ng-messages has no one-to-one Angular form -->
                <div ng-messages="theForm()?.connectorName?.$error">
                    <!-- TODO(port): ng-message has no one-to-one Angular form -->
                    <div ng-message="required" translate>gateway.connector-name-required</div>
                </div>
            </mat-form-field>
        </div>
        <div layout="row" layout-align="end center" class="action-buttons" [ngClass]="{'gateway-config-row-vertical': changeAlignment()}">
            <button mat-icon-button [disabled]="isReadOnly()" (click)="openConfigDialog($event, $index, connector.config, connector.name)" attr.aria-label="{{ 'gateway.update-config' | translate }}" [ngClass]="{'md-warn': validateJSON(connector?.config)}" attr.matTooltip="{{ 'gateway.update-config' | translate }}" matTooltipPosition="above">
                <mat-icon class="material-icons">more_horiz</mat-icon>
                
            </button>
            <button mat-icon-button [disabled]="isReadOnly()" (click)="removeConnector($index)" attr.aria-label="{{ 'gateway.delete' | translate }}" attr.matTooltip="{{ 'gateway.delete' | translate }}" matTooltipPosition="above">
                <mat-icon class="material-icons">close</mat-icon>
                
            </button>
        </div>
    </section>
    }
    <span [hidden]="!(!gatewayConfig()?.length)" layout-align="center center" [ngClass]="{'disabled': disabled()}" class="no-data-found" translate>{{'gateway.no-connectors'}}</span>
    <div>
        <button mat-raised-button [hidden]="!(!isReadOnly())" (click)="addNewConnector()" attr.aria-label="{{ 'gateway.connector-add' | translate }}" attr.matTooltip="{{ 'gateway.connector-add' | translate }}" matTooltipPosition="above">
            
            <span translate>action.add</span>
        </button>
    </div>
</section>
