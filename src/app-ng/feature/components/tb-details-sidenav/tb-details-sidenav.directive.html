<mat-sidenav class="md-sidenav-right md-whiteframe-4dp tb-sidenav-details" position="end" mode="over" [opened]="isOpen()">
      <header>
	      <mat-toolbar class="md-theme-light" [ngStyle]="{'height':headerHeightPx()+'px'}">
	      	<div class="md-toolbar-tools" layout="row">
	      		<div flex class="md-toolbar-tools" layout="column" layout-align="start start">
		        	<span class="tb-details-title">{{headerTitle()}}</span>
		        	<span class="tb-details-subtitle">{{headerSubtitle()}}</span>
					<span style="width: 100%;"><ng-content select="header-pane, [header-pane], .tb-header-pane"></ng-content></span>
	        	</div>
				<div><ng-content select="details-buttons, [details-buttons], .tb-details-buttons"></ng-content></div>
	        	<button mat-icon-button (click)="closeDetails()">
	        		<mat-icon aria-label="close" class="material-icons">close</mat-icon>
	        	</button>	        	
	        </div>
		    @if (!isReadOnly()) {
		      <section layout="row" layout-wrap class="tb-header-buttons md-fab">
				<button mat-fab color="accent" [hidden]="!(isEdit())" [disabled]="rootScope?.loading || theForm()?.$invalid || !theForm()?.$dirty" class="tb-btn-header md-hue-2 md-fab-bottom-right" attr.aria-label="{{ 'action.apply' | translate }}" (click)="detailsApply()" attr.matTooltip="{{ 'action.apply-changes' | translate }}" matTooltipPosition="above">
					  
					  <mat-icon>done</mat-icon>
				</button>
				<button mat-fab color="accent" [disabled]="rootScope?.loading || (isAlwaysEdit() && !theForm()?.$dirty)" class="tb-btn-header md-hue-2 md-fab-bottom-right" attr.aria-label="{{ 'details.edit-mode' | translate }}" (click)="toggleDetailsEditMode()" attr.matTooltip="{{ (isAlwaysEdit() ? 'action.decline-changes' : 'details.toggle-edit-mode') | translate }}" matTooltipPosition="above">
					
					<mat-icon options='{"easing": "circ-in-out", "duration": 375, "rotation": "none"}'>{{isEdit() ? 'close' : 'edit'}}</mat-icon>
				</button>
			</section>
		    }
	      </mat-toolbar>
      </header>
      <div flex class="md-content">
			<div><ng-content></ng-content></div>
      </div>
</mat-sidenav>
