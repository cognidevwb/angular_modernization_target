<section layout="column" class="tb-kv-map">
    <label translate class="tb-title no-padding">{{ titleText() }}</label>
    @for (keyVal of kvList; track $index) {
      <div layout="row" style="max-height: 40px;" layout-align="start center">
        <mat-form-field flex class="md-block" style="margin: 10px 0px 0px 0px; max-height: 40px;">
            <input matInput attr.placeholder="{{ (keyPlaceholderText() ? keyPlaceholderText() : 'key-val.key') | translate }}" [disabled]="disabled()" [required]="true" name="key" [(ngModel)]="keyVal.key">
        </mat-form-field>
        <mat-form-field flex class="md-block" style="margin: 10px 0px 0px 0px; max-height: 40px;">
            <input matInput attr.placeholder="{{ (valuePlaceholderText() ? valuePlaceholderText() : 'key-val.value') | translate }}" [disabled]="disabled()" [required]="true" name="value" [(ngModel)]="keyVal.value">
        </mat-form-field>
        <button mat-icon-button color="primary" [hidden]="!(!disabled())" [disabled]="rootScope?.loading" (click)="removeKeyVal($index)" attr.aria-label="{{ 'action.remove' | translate }}" attr.matTooltip="{{ 'key-val.remove-entry' | translate }}" matTooltipPosition="above">
            
            <mat-icon attr.aria-label="{{ 'action.delete' | translate }}" class="material-icons">
                close
            </mat-icon>
        </button>
    </div>
    }
    <span [hidden]="!(!kvList?.length)" layout-align="center center" [ngClass]="{'disabled': disabled()}" class="no-data-found" translate>{{noDataText() ? noDataText() : 'key-val.no-data'}}</span>
    <div>
        <button mat-raised-button color="primary" [hidden]="!(!disabled())" [disabled]="rootScope?.loading" (click)="addKeyVal()" attr.aria-label="{{ 'action.add' | translate }}" attr.matTooltip="{{ 'key-val.add-entry' | translate }}" matTooltipPosition="above">
            
            <span translate>action.add</span>
        </button>
    </div>
</section>
