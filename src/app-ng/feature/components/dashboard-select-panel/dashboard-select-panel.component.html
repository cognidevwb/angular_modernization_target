<!-- Ported from src/app/components/dashboard-select-panel.tpl.html -->
<div flex layout="column" class="md-content">
    <section flex layout="column">
        <div flex class="md-content md-padding" layout="column">
            <mat-form-field flex>
                <mat-label>{{ 'dashboard.select-dashboard' | translate }}</mat-label>
                <mat-select [(ngModel)]="dashboardId" (ngModelChange)="dashboardSelected($event)">
                    @for (dashboard of dashboards; track dashboard.id.id) {
                    <mat-option [value]="dashboard.id.id">{{ dashboard.title }}</mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </div>
    </section>
</div>
