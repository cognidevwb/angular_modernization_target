<button mat-raised-button color="primary" type="button" (click)="onManageUsers.emit({event: $event})" [hidden]="!(!isEdit() && !isPublic)">{{ 'customer.manage-users' | translate }}</button>
<button mat-raised-button color="primary" type="button" (click)="onManageAssets.emit({event: $event})" [hidden]="!(!isEdit() && !isPublic)">{{ 'customer.manage-assets' | translate }}</button>
<button mat-raised-button color="primary" type="button" (click)="onManageDevices.emit({event: $event})" [hidden]="!(!isEdit())">{{ 'customer.manage-devices' | translate }}</button>
<button mat-raised-button color="primary" type="button" (click)="onManageDashboards.emit({event: $event})" [hidden]="!(!isEdit())">{{ 'customer.manage-dashboards' | translate }}</button>
<button mat-raised-button color="primary" type="button" (click)="onDeleteCustomer.emit({event: $event})" [hidden]="!(!isEdit() && !isPublic)">{{ 'customer.delete' | translate }}</button>

<div layout="row">
	<button mat-raised-button type="button" (click)="copyCustomerId($event)" [hidden]="!(!isEdit())">
		<mat-icon svgIcon="mdi:clipboard-arrow-left"></mat-icon>
		<span>{{ 'customer.copyId' | translate }}</span>
	</button>
</div>

<div class="md-content md-padding" layout="column">
	@if (customer(); as c) {
	  <fieldset [hidden]="!(!isPublic)" [disabled]="rootScope.loading || !isEdit()">
		<mat-form-field class="md-block">
			<mat-label>{{ 'customer.title' | translate }}</mat-label>
			<input matInput required name="title" [(ngModel)]="c.title" #title="ngModel">
			@if (title.errors?.['required']) {
			  <mat-error>{{ 'customer.title-required' | translate }}</mat-error>
			}
		</mat-form-field>
		<mat-form-field class="md-block">
			<mat-label>{{ 'customer.description' | translate }}</mat-label>
			<textarea matInput name="description" [ngModel]="c.additionalInfo?.description" (ngModelChange)="setAdditionalInfo(c, 'description', $event)" rows="2"></textarea>
		</mat-form-field>
		<tb-contact [contact]="c" [theForm]="theForm()" [isEdit]="isEdit()"></tb-contact>
	  </fieldset>
	}
</div>
