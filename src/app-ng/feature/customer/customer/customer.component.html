<tb-grid [config]="customerGridConfig" [itemCardComponent]="customerCard" [addItemComponent]="addCustomerDialog">
	<div details-buttons>
		<tb-grid-help helpId="customers"></tb-grid-help>
	</div>
	@if (grid && grid.operatingItem(); as customer) {
	  <mat-tab-group [ngClass]="{'tb-headless': grid.detailsConfig.isDetailsEditMode}" id="tabs" flex class="tb-absolute-fill" (selectedTabChange)="grid.triggerResize()">
		<mat-tab [label]="'customer.details' | translate">
			<tb-customer [customer]="customer" [(isEdit)]="grid.detailsConfig.isDetailsEditMode" [theForm]="grid.detailsForm" (onManageUsers)="openCustomerUsers($event.event, grid.detailsConfig.currentItem)" (onManageAssets)="openCustomerAssets($event.event, grid.detailsConfig.currentItem)" (onManageDevices)="openCustomerDevices($event.event, grid.detailsConfig.currentItem)" (onManageDashboards)="openCustomerDashboards($event.event, grid.detailsConfig.currentItem)" (onDeleteCustomer)="grid.deleteItem($event.event, grid.detailsConfig.currentItem)"></tb-customer>
		</mat-tab>
		@if (!grid.detailsConfig.isDetailsEditMode) {
		  <mat-tab [label]="'attribute.attributes' | translate">
			<tb-attribute-table flex [entityId]="customer.id?.id" [entityType]="types.entityType.customer" [entityName]="customer.title" [defaultAttributeScope]="types.attributesScope.server.value"></tb-attribute-table>
		  </mat-tab>
		  <mat-tab [label]="'attribute.latest-telemetry' | translate">
			<tb-attribute-table flex [entityId]="customer.id?.id" [entityType]="types.entityType.customer" [entityName]="customer.title" [defaultAttributeScope]="types.latestTelemetry.value" [disableAttributeScopeSelection]="true"></tb-attribute-table>
		  </mat-tab>
		  <mat-tab [label]="'alarm.alarms' | translate">
			<tb-alarm-table flex [entityType]="types.entityType.customer" [entityId]="customer.id?.id"></tb-alarm-table>
		  </mat-tab>
		  <mat-tab [label]="'customer.events' | translate">
			<tb-event-table flex [entityType]="types.entityType.customer" [entityId]="customer.id?.id" [tenantId]="customer.tenantId?.id" [attr.default-event-type]="types.eventType.error.value"></tb-event-table>
		  </mat-tab>
		  <mat-tab [label]="'relation.relations' | translate">
			<tb-relation-table flex [entityId]="customer.id?.id" [entityType]="types.entityType.customer"></tb-relation-table>
		  </mat-tab>
		  @if (grid.isTenantAdmin()) {
		    <mat-tab [label]="'audit-log.audit-logs' | translate">
			  <tb-audit-log-table flex [customerId]="customer.id?.id" [auditLogMode]="types.auditLogMode.customer"></tb-audit-log-table>
		    </mat-tab>
		  }
		}
	  </mat-tab-group>
	}
</tb-grid>
