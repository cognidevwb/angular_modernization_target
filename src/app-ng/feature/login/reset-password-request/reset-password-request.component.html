<div layout="row" layout-align="center center" style="width: 100%;" class="md-content">
    <mat-card flex="initial" class="tb-login-card">
        <mat-card-header>
            <mat-card-title>
                <span class="md-headline">{{ 'login.request-password-reset' | translate }}</span>
            </mat-card-title>
        </mat-card-header>
        <mat-progress-bar color="warn" style="z-index: 1; max-height: 5px; width: inherit; position: absolute" mode="indeterminate" [style.visibility]="(!rootScope?.loading) ? 'hidden' : 'visible'" [hidden]="!(rootScope?.loading)"></mat-progress-bar>
        <mat-card-content>
            <form class="request-password-reset-form" (ngSubmit)="sendResetPasswordLink()">
                <div layout="column" layout-padding="" id="toast-parent">
                    <span style="height: 50px;"></span>
                    <mat-form-field class="md-block">
                        <mat-label>{{ 'login.email' | translate }}</mat-label>
                        <mat-icon attr.aria-label="{{ 'login.email' | translate }}" class="material-icons">
                            email
                        </mat-icon>
                        <input matInput id="email-input" type="email" autofocus [(ngModel)]="email">
                    </mat-form-field>
                    <div layout="column" layout-gt-sm="row" layout-padding="" layout-align="start center" layout-align-gt-sm="center start">
                        <button mat-raised-button color="accent" type="submit">{{ 'login.request-password-reset' |
                            translate }}
                        </button>
                        <!-- TODO(port): ui-sref has no one-to-one Angular form -->
                        <a mat-raised-button ui-sref="login">{{ 'action.cancel' | translate }}</a>
                    </div>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
