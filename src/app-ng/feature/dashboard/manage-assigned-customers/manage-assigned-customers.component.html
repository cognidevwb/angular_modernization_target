<form #theForm="ngForm" (ngSubmit)="submit()" style="width: 600px;" [attr.aria-label]="titleText | translate">
    <mat-toolbar>
        <div class="md-toolbar-tools">
            <h2>{{ titleText | translate }}</h2>
            <span flex></span>
            <button mat-icon-button type="button" (click)="cancel()">
                <mat-icon [attr.aria-label]="'dialog.close' | translate">close</mat-icon>
            </button>
        </div>
    </mat-toolbar>
    <mat-progress-bar color="warn" mode="indeterminate" [style.visibility]="rootScope.loading ? 'visible' : 'hidden'"></mat-progress-bar>
    <mat-dialog-content>
        <div class="md-dialog-content">
            <fieldset>
                <span>{{ labelText | translate }}</span>
                <tb-entity-list name="assignedCustomers" [ngDisabled]="rootScope.loading" [(ngModel)]="assignedCustomers" [entityType]="types.entityType.customer"></tb-entity-list>
            </fieldset>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions layout="row">
        <span flex></span>
        <button mat-raised-button color="primary" type="submit" [disabled]="rootScope.loading || !theForm.dirty || !theForm.valid">
            {{ actionName | translate }}
        </button>
        <button mat-button type="button" [disabled]="rootScope.loading" (click)="cancel()" style="margin-right:20px;">{{ 'action.cancel' | translate }}</button>
    </mat-dialog-actions>
</form>
