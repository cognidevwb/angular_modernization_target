<div attr.aria-label="{{ 'dashboard.manage-states' | translate }}" style="min-width: 600px;" class="md-dialog">
    <form name="theForm" (ngSubmit)="save()">
        <mat-toolbar>
            <div class="md-toolbar-tools">
                <h2 translate>{{ 'dashboard.manage-states' }}</h2>
                <span flex></span>
                <button mat-icon-button (click)="cancel()">
                    <mat-icon attr.aria-label="{{ 'dialog.close' | translate }}">close</mat-icon>
                </button>
            </div>
        </mat-toolbar>
        <mat-progress-bar color="warn" mode="indeterminate" [style.visibility]="(!rootScope?.loading) ? 'hidden' : 'visible'" [hidden]="!(rootScope?.loading)"></mat-progress-bar>
        <span style="min-height: 5px;" flex="" [hidden]="!(!rootScope?.loading)"></span>
        <mat-dialog-content>
            <div class="md-dialog-content">
                <fieldset [disabled]="rootScope?.loading">
                    <div class="manage-dashboard-states" layout="column">
                        <mat-toolbar class="md-table-toolbar md-default" [hidden]="!(query?.search === null)">
                            <div class="md-toolbar-tools">
                                <span translate>dashboard.states</span>
                                <span flex></span>
                                <button mat-icon-button (click)="addState($event)" attr.matTooltip="{{ 'dashboard.add-state' | translate }}" matTooltipPosition="above">
                                    <mat-icon>add</mat-icon>
                                    
                                </button>
                                <button mat-icon-button (click)="enterFilterMode()" attr.matTooltip="{{ 'action.search' | translate }}" matTooltipPosition="above">
                                    <mat-icon>search</mat-icon>
                                    
                                </button>
                            </div>
                        </mat-toolbar>
                        <mat-toolbar class="md-table-toolbar md-default" [hidden]="!(query?.search != null)">
                            <div class="md-toolbar-tools">
                                <button mat-icon-button attr.aria-label="{{ 'action.search' | translate }}" attr.matTooltip="{{ 'dashboard.search-states' | translate }}" matTooltipPosition="above">
                                    <mat-icon attr.aria-label="{{ 'action.search' | translate }}" class="material-icons">search</mat-icon>
                                    
                                </button>
                                <mat-form-field flex>
                                    <mat-label>&nbsp;</mat-label>
                                    <input matInput [(ngModel)]="query.search" attr.placeholder="{{ 'dashboard.search-states' | translate }}">
                                </mat-form-field>
                                <button mat-icon-button aria-label="Close" (click)="exitFilterMode()" attr.matTooltip="{{ 'action.close' | translate }}" matTooltipPosition="above">
                                    <mat-icon aria-label="Close" class="material-icons">close</mat-icon>
                                    
                                </button>
                            </div>
                        </mat-toolbar>
                        <table mat-table [dataSource]="states" matSort (matSortChange)="onReorder($event)">
                            <ng-container matColumnDef="name">
                                <th mat-header-cell *matHeaderCellDef mat-sort-header="name"><span translate>dashboard.state-name</span></th>
                                <td mat-cell *matCellDef="let state">{{state?.name}}</td>
                            </ng-container>
                            <ng-container matColumnDef="id">
                                <th mat-header-cell *matHeaderCellDef mat-sort-header="id"><span translate>dashboard.state-id</span></th>
                                <td mat-cell *matCellDef="let state">{{state?.id}}</td>
                            </ng-container>
                            <ng-container matColumnDef="root">
                                <th mat-header-cell *matHeaderCellDef mat-sort-header="root"><span translate>dashboard.is-root-state</span></th>
                                <td mat-cell *matCellDef="let state">
                                    <mat-checkbox attr.aria-label="{{'dashboard.is-root-state' | translate }}" disabled [(ngModel)]="state.root">
                                    </mat-checkbox>
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="actions">
                                <th mat-header-cell *matHeaderCellDef><span>&nbsp</span></th>
                                <td mat-cell *matCellDef="let state" class="tb-action-cell">
                                    <button mat-icon-button attr.aria-label="{{ 'action.edit' | translate }}" (click)="editState($event, state)" attr.matTooltip="{{ 'dashboard.edit-state' | translate }}" matTooltipPosition="above">
                                        <mat-icon attr.aria-label="{{ 'action.edit' | translate }}" class="material-icons">edit</mat-icon>
                                        
                                    </button>
                                    <button mat-icon-button [hidden]="!(!state?.root)" aria-label="Delete" (click)="deleteState($event, state)" attr.matTooltip="{{ 'dashboard.delete-state' | translate }}" matTooltipPosition="above">
                                        <mat-icon aria-label="Delete" class="material-icons">delete</mat-icon>
                                        
                                    </button>
                                </td>
                            </ng-container>
                            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                            <tr mat-row *matRowDef="let state; columns: displayedColumns;" [class.disabled]="state?.root"></tr>
                        </table>
                        <mat-paginator [length]="statesCount" [pageSize]="query.limit" [pageSizeOptions]="[5, 10, 15]" [pageIndex]="query.page - 1" (page)="onPaginate($event)"></mat-paginator>
                    </div>
                </fieldset>
            </div>
        </mat-dialog-content>
        <mat-dialog-actions layout="row">
            <span flex></span>
            <button mat-raised-button color="primary" [disabled]="rootScope?.loading || !theForm?.$dirty || !theForm?.$valid" type="submit">
                {{ 'action.save' | translate }}
            </button>
            <button mat-button [disabled]="rootScope?.loading" (click)="cancel()" style="margin-right:20px;">{{ 'action.cancel' | translate }}</button>
        </mat-dialog-actions>
    </form>
</div>
