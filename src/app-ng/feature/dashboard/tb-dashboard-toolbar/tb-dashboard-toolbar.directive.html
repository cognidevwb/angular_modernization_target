<md-fab-toolbar md-open="vm.toolbarOpened" md-direction="left" [ngClass]="{'is-fullscreen': forceFullscreen(), 'md-whiteframe-z1': forceFullscreen() && toolbarOpened() }">
    <!-- TODO(port): md-fab-trigger: the mat-fab that opens the speed dial --><md-fab-trigger class="align-with-text">
        <button mat-fab color="primary" aria-label="menu" (click)="onTriggerClick.emit(undefined)" attr.matTooltip="{{ 'dashboard.open-toolbar' | translate }}" matTooltipPosition="below">
            <!-- TODO(port): the md-tooltip had its own AngularJS directives; bind matTooltipDisabled for them -->
            <mat-icon aria-label="dashboard-toolbar" class="material-icons">more_horiz</mat-icon>
        </button>
    </md-fab-trigger>
    <mat-toolbar>
        <!-- TODO(port): md-fab-actions: the buttons the speed dial shows --><md-fab-actions class="md-toolbar-tools">
            <div><ng-content></ng-content></div>
        </md-fab-actions>
    </mat-toolbar>
</md-fab-toolbar>
