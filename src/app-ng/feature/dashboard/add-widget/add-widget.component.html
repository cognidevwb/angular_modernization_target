<div [attr.aria-label]="'widget.add' | translate" style="width: 900px;" [attr.tb-help]="helpLinkIdForWidgetType()" help-container-id="help-container" class="md-dialog">
    <form #theFormRef="ngForm" name="theForm" (ngSubmit)="add()">
        <mat-toolbar>
            <div class="md-toolbar-tools">
                <h2>{{ 'widget.add' | translate }}</h2>
                <span flex></span>
                <div id="help-container"></div>
                <button mat-icon-button type="button" (click)="cancel()">
                    <mat-icon [attr.aria-label]="'dialog.close' | translate">close</mat-icon>
                </button>
            </div>
        </mat-toolbar>
        <mat-progress-bar color="warn" mode="indeterminate" [style.visibility]="(!rootScope['loading']) ? 'hidden' : 'visible'" [hidden]="!rootScope['loading']"></mat-progress-bar>
        <span style="min-height: 5px;" flex="" [hidden]="rootScope['loading']"></span>
        <mat-dialog-content>
            <div class="md-dialog-content" style="padding-top: 0px;">
                <fieldset [disabled]="rootScope['loading']" style="position: relative; height: 600px;">
                    <tb-widget-config [(widgetType)]="widget.type" [(typeParameters)]="widgetInfo.typeParameters" [(actionSources)]="widgetInfo.actionSources"
                                      [forceExpandDatasources]="true" [(ngModel)]="widgetConfig" name="widgetConfig"
                                      [(widgetSettingsSchema)]="settingsSchema" [(datakeySettingsSchema)]="dataKeySettingsSchema"
                                      [aliasController]="aliasController" [functionsOnly]="functionsOnly"
                                      [fetchEntityKeys]="fetchEntityKeys" [fetchDashboardStates]="fetchDashboardStates"
                                      [onCreateEntityAlias]="createEntityAlias" [theForm]="theForm"></tb-widget-config>
                </fieldset>
            </div>
        </mat-dialog-content>
        <mat-dialog-actions layout="row">
            <span flex></span>
            <button mat-raised-button color="primary" [disabled]="rootScope['loading'] || theForm.$invalid" type="submit">
                {{ 'action.add' | translate }}
            </button>
            <button mat-button type="button" [disabled]="rootScope['loading']" (click)="cancel()" style="margin-right:20px;">{{ 'action.cancel' | translate }}</button>
        </mat-dialog-actions>
    </form>
</div>
