<div attr.aria-label="{{ 'dashboard.select-state' | translate }}" class="md-dialog">
    <form name="theForm" #theForm="ngForm" (ngSubmit)="save(theForm)">
        <mat-toolbar>
            <div class="md-toolbar-tools">
                <h2>{{ 'dashboard.select-state' | translate }}</h2>
                <span flex></span>
                <button mat-icon-button type="button" (click)="cancel()">
                    <mat-icon attr.aria-label="{{ 'dialog.close' | translate }}">close</mat-icon>
                </button>
            </div>
        </mat-toolbar>
        <mat-progress-bar color="warn" mode="indeterminate" [style.visibility]="(!rootScope?.loading) ? 'hidden' : 'visible'" [hidden]="!(rootScope?.loading)"></mat-progress-bar>
        <span style="min-height: 5px;" flex="" [hidden]="!(!rootScope?.loading)"></span>
        <mat-dialog-content>
            <div class="md-dialog-content">
                <fieldset [disabled]="rootScope?.loading">
                    <mat-select required name="stateId" attr.aria-label="{{ 'dashboard.state' | translate }}" [(ngModel)]="stateId">
                        @for (stateId of __keys(states); track stateId) {
                          @let state = (states)[stateId];
                          <mat-option [value]="stateId">
                            {{state?.name}}
                        </mat-option>
                        }
                    </mat-select>
                </fieldset>
            </div>
        </mat-dialog-content>
        <mat-dialog-actions layout="row">
            <span flex></span>
            <button mat-raised-button color="primary" [disabled]="rootScope?.loading || theForm.invalid" type="submit">
                {{ 'action.select' | translate }}
            </button>
            <button mat-button type="button" [disabled]="rootScope?.loading" (click)="cancel()" style="margin-right:20px;">{{ 'action.cancel' | translate }}</button>
        </mat-dialog-actions>
    </form>
</div>
