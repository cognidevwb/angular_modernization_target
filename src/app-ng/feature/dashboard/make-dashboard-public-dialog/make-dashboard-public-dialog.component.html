<form [attr.aria-label]="'dashboard.make-public' | translate" style="min-width: 400px;">
    <mat-toolbar>
        <div class="md-toolbar-tools">
            <h2>{{ 'dashboard.public-dashboard-title' | translate }}</h2>
            <span flex></span>
            <button mat-icon-button type="button" (click)="close()">
                <mat-icon [attr.aria-label]="'dialog.close' | translate">close</mat-icon>
            </button>
        </div>
    </mat-toolbar>
    <mat-dialog-content>
        <div id="make-dialog-public-content" class="md-dialog-content">
            <div class="md-content md-padding" layout="column">
                <span [innerHTML]="'dashboard.public-dashboard-text' | translate: { dashboardTitle: dashboard?.title, publicLink: publicLink }"></span>
                <div layout="row" layout-align="start center">
                    <pre class="tb-highlight" flex><code>{{ publicLink }}</code></pre>
                    <button mat-icon-button type="button" (click)="copyPublicLink($event)" [matTooltip]="'dashboard.copy-public-link' | translate" matTooltipPosition="above">
                        <mat-icon svgIcon="mdi:clipboard-arrow-left"></mat-icon>
                    </button>
                </div>
                <div class="tb-notice">{{ 'dashboard.public-dashboard-notice' | translate }}</div>
                <tb-social-share-panel style="padding-top: 15px;" [shareTitle]="'dashboard.socialshare-title' | translate: { dashboardTitle: dashboard?.title }" [shareText]="'dashboard.socialshare-text' | translate: { dashboardTitle: dashboard?.title }" [shareLink]="publicLink" shareHashTags="thingsboard, iot">
                </tb-social-share-panel>
            </div>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions layout="row">
        <span flex></span>
        <button mat-button type="button" (click)="close()">{{ 'action.ok' | translate }}</button>
    </mat-dialog-actions>
</form>
