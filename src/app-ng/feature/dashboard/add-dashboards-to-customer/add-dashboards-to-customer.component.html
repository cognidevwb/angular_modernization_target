<div attr.aria-label="{{ 'dashboard.assign-dashboard-to-customer' | translate }}" class="md-dialog">
    <form name="theForm" (ngSubmit)="assign()">
        <mat-toolbar>
            <div class="md-toolbar-tools">
                <h2 translate>dashboard.assign-dashboard-to-customer</h2>
                <span flex></span>
                <button mat-icon-button (click)="cancel()">
                    <mat-icon attr.aria-label="{{ 'dialog.close' | translate }}">close</mat-icon>
                </button>
            </div>
        </mat-toolbar>
        <mat-progress-bar color="warn" mode="indeterminate" [style.visibility]="(!rootScope?.loading) ? 'hidden' : 'visible'" [hidden]="!(rootScope?.loading)"></mat-progress-bar>
        <span style="min-height: 5px;" flex="" [hidden]="!(!rootScope?.loading)"></span>
        <mat-dialog-content>
            <div class="md-dialog-content">
                <fieldset>
                    <span translate>dashboard.assign-dashboard-to-customer-text</span>
                    <mat-form-field class="md-block" style='margin-bottom: 0px;'>
                        <mat-label>&nbsp;</mat-label>
                        <mat-icon attr.aria-label="{{ 'action.search' | translate }}" class="material-icons">
                            search
                        </mat-icon>
                        <input matInput id="dashboard-search" autofocus [(ngModel)]="searchText" (ngModelChange)="searchDashboardTextUpdated()" attr.placeholder="{{ 'common.enter-search' | translate }}">
                    </mat-form-field>
                    <div style='min-height: 150px;'>
					<span translate layout-align="center center" style="text-transform: uppercase; display: flex; height: 150px;" class="md-subhead" [hidden]="!(noData())">dashboard.no-dashboards-text</span>
                        <cdk-virtual-scroll-viewport itemSize="48" [hidden]="!(hasData())" tb-scope-element="repeatContainer" flex style='min-height: 150px; width: 100%;'>
                            <mat-list>
                                <mat-list-item *cdkVirtualFor="let dashboard of dashboards.data" class="repeated-item" flex>
                                    <mat-checkbox (click)="toggleDashboardSelection($event, dashboard)" attr.aria-label="{{ 'item.selected' | translate }}" [checked]="dashboard?.selected"></mat-checkbox>
                                    <span> {{ dashboard?.title }} </span>
                                </mat-list-item>
                            </mat-list>
                        </cdk-virtual-scroll-viewport>
                    </div>
                </fieldset>
            </div>
        </mat-dialog-content>
        <mat-dialog-actions layout="row">
            <span flex></span>
            <button mat-raised-button color="primary" [disabled]="rootScope?.loading || dashboards?.selectedCount == 0" type="submit">
                {{ 'action.assign' | translate }}
            </button>
            <button mat-button [disabled]="rootScope?.loading" (click)="cancel()" style="margin-right:20px;">{{ 'action.cancel' |
                translate }}
            </button>
        </mat-dialog-actions>
    </form>
</div>
