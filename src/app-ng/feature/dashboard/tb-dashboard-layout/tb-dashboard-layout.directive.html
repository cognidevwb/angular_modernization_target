<div style="position: relative; width: 100%; height: 100%;" [ngStyle]="{'background-color': layoutCtx()?.gridSettings?.backgroundColor,
                    'background-image': 'url('+layoutCtx()?.gridSettings?.backgroundImageUrl+')',
                    'background-repeat': 'no-repeat',
                    'background-attachment': 'scroll',
                    'background-size': layoutCtx()?.gridSettings?.backgroundSizeMode || '100%',
                    'background-position': '0% 0%'}" class="md-content">
    <section [hidden]="!(!rootScope?.loading && noData())" layout-align="center center" [ngStyle]="{'color': layoutCtx()?.gridSettings?.color}" style="text-transform: uppercase; display: flex; z-index: 1; pointer-events: none;" class="md-headline tb-absolute-fill">
            @if (!isEdit()) {
              <span translate>
                dashboard.no-widgets
            </span>
            }
        @if (isEdit() && !widgetEditMode()) {
          <button mat-button class="tb-add-new-widget" (click)="addWidget({event: $event})">
            <mat-icon attr.aria-label="{{ 'action.add' | translate }}" class="material-icons tb-md-96">add</mat-icon>
            {{ 'dashboard.add-widget' | translate }}
        </button>
        }
    </section>
    <tb-dashboard [dashboardStyle]="{'background-color': layoutCtx()?.gridSettings?.backgroundColor,
                            'background-image': 'url('+layoutCtx()?.gridSettings?.backgroundImageUrl+')',
                            'background-repeat': 'no-repeat',
                            'background-attachment': 'scroll',
                            'background-size': layoutCtx()?.gridSettings?.backgroundSizeMode || '100%',
                            'background-position': '0% 0%'}" [widgets]="layoutCtx().widgets" (widgetsChange)="layoutCtx().widgets = $event" [widgetLayouts]="layoutCtx().widgetLayouts" (widgetLayoutsChange)="layoutCtx().widgetLayouts = $event" [columns]="layoutCtx().gridSettings.columns" (columnsChange)="layoutCtx().gridSettings.columns = $event" [margins]="layoutCtx().gridSettings.margins" (marginsChange)="layoutCtx().gridSettings.margins = $event" [aliasController]="dashboardCtx().aliasController" (aliasControllerChange)="dashboardCtx().aliasController = $event" [stateController]="dashboardCtx().stateController" (stateControllerChange)="dashboardCtx().stateController = $event" [dashboardTimewindow]="dashboardCtx().dashboardTimewindow" (dashboardTimewindowChange)="dashboardCtx().dashboardTimewindow = $event" [(isEdit)]="isEdit" [autofillHeight]="layoutCtx()?.gridSettings?.autoFillHeight && !isEdit()" [mobileAutofillHeight]="layoutCtx()?.gridSettings?.mobileAutoFillHeight && !isEdit()" [mobileRowHeight]="layoutCtx().gridSettings.mobileRowHeight" (mobileRowHeightChange)="layoutCtx().gridSettings.mobileRowHeight = $event" [(isMobile)]="isMobile" [(isMobileDisabled)]="widgetEditMode" [(isEditActionEnabled)]="isEdit" [isExportActionEnabled]="isEdit() && !widgetEditMode()" [isRemoveActionEnabled]="isEdit() && !widgetEditMode()" (onEditWidget)="editWidget(event, widget)" (onExportWidget)="exportWidget(event, widget)" (onWidgetMouseDown)="widgetMouseDown(event, widget)" (onWidgetClicked)="widgetClicked(event, widget)" (prepareDashboardContextMenu)="prepareDashboardContextMenu()" (prepareWidgetContextMenu)="prepareWidgetContextMenu(widget)" (onRemoveWidget)="removeWidget(event, widget)" (onInit)="dashboardInited(dashboard)" (onInitFailed)="dashboardInitFailed(e)" [ignoreLoading]="layoutCtx().ignoreLoading" (ignoreLoadingChange)="layoutCtx().ignoreLoading = $event">
    </tb-dashboard>
</div>
