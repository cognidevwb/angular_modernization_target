<section flex layout='column' class="tb-entity-subtype-list">
    <mat-chip-grid #entitySubtypeChipGrid id="entity_subtype_list_chips" [disabled]="disabled()" [required]="tbRequired()">
        @for (subtype of entitySubtypesList; track subtype) {
            <mat-chip-row (removed)="removeSubtype(subtype)">
                <span>
                    <strong>{{subtype}}</strong>
                </span>
                <button matChipRemove type="button">
                    <mat-icon>cancel</mat-icon>
                </button>
            </mat-chip-row>
        }
        <input
            id="entitySubtype"
            [placeholder]="(!entitySubtypesList || !entitySubtypesList?.length) ? placeholder : secondaryPlaceholder"
            [matChipInputFor]="entitySubtypeChipGrid"
            [matAutocomplete]="entitySubtypeAuto"
            [(ngModel)]="entitySubtypeSearchText"
            (ngModelChange)="onSearchTextChanged()"
            (focus)="onSearchTextChanged()"
            (blur)="inputTouched = true" />
    </mat-chip-grid>
    <mat-autocomplete #entitySubtypeAuto="matAutocomplete" (optionSelected)="onSubtypeSelected($event)">
        @for (item of filteredSubtypes; track item) {
            <mat-option [value]="item">{{item}}</mat-option>
        } @empty {
            <mat-option disabled>
                <span>{{ noSubtypesMathingText | translate: { entitySubtype: entitySubtypeSearchText } }}</span>
            </mat-option>
        }
    </mat-autocomplete>
    <!-- TODO(port): ng-messages has no one-to-one Angular form -->
    @if (inputTouched && tbRequired()) {
      <div class="tb-error-messages" ng-messages="ngModelCtrl?.$error" role="alert">
        <!-- TODO(port): ng-message has no one-to-one Angular form -->
        <div translate ng-message="entitySubtypesList" class="tb-error-message">{{subtypeListEmptyText}}</div>
    </div>
    }
</section>
