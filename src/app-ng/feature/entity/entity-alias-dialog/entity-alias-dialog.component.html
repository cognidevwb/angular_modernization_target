<div class="md-dialog tb-entity-alias-dialog" style="width: 600px;" attr.aria-label="{{ (isAdd ? 'alias.add' : 'alias.edit') | translate  }}">
    <form name="theForm" (ngSubmit)="save()">
        <mat-toolbar>
            <div class="md-toolbar-tools">
                <h2>{{ (isAdd ? 'alias.add' : 'alias.edit') | translate  }}</h2>
                <span flex></span>
                <button mat-icon-button (click)="cancel()">
                    <mat-icon attr.aria-label="{{ 'dialog.close' | translate }}">close</mat-icon>
                </button>
            </div>
        </mat-toolbar>
        <mat-progress-bar color="warn" mode="indeterminate" [style.visibility]="(!rootScope?.loading) ? 'hidden' : 'visible'" [hidden]="!(rootScope?.loading)"></mat-progress-bar>
        <span style="min-height: 5px;" flex="" [hidden]="!(!rootScope?.loading)"></span>
        <mat-dialog-content>
            <div class="md-dialog-content">
                <fieldset [disabled]="rootScope?.loading">
                    <div flex layout="column">
                        <div layout="row">
                            <mat-form-field flex class="md-block">
                                <mat-label>{{ 'alias.name' | translate }}</mat-label>
                                <input matInput required name="aliasName" [(ngModel)]="alias.alias" attr.aria-label="{{ 'alias.name' | translate }}">
                                <!-- TODO(port): ng-messages has no one-to-one Angular form -->
                                <div ng-messages="theForm?.aliasName?.$error">
                                    <!-- TODO(port): ng-message has no one-to-one Angular form -->
                                    <div ng-message="required">{{ 'alias.name-required' | translate }}</div>
                                    <!-- TODO(port): ng-message has no one-to-one Angular form -->
                                    <div ng-message="duplicateAliasName">{{ 'alias.duplicate-alias' | translate }}</div>
                                </div>
                            </mat-form-field>
                            <section class="tb-resolve-multiple-switch" layout="column" layout-align="start center">
                                <label class="tb-small resolve-multiple-label">{{ 'alias.resolve-multiple' | translate }}</label>
                                <mat-slide-toggle class="resolve-multiple-switch" [(ngModel)]="alias.filter.resolveMultiple" attr.aria-label="{{ 'alias.resolve-multiple' | translate }}">
                                </mat-slide-toggle>
                            </section>
                        </div>
                        <tb-entity-filter [(ngModel)]="alias.filter" [(allowedEntityTypes)]="allowedEntityTypes" [(theForm)]="theForm">
                        </tb-entity-filter>
                        <!-- TODO(port): ng-messages has no one-to-one Angular form -->
                        <div class="tb-error-messages" ng-messages="theForm?.$error" role="alert">
                            <!-- TODO(port): ng-message has no one-to-one Angular form -->
                            <div ng-message="entityFilter" class="tb-error-message">{{ 'alias.entity-filter-no-entity-matched' | translate }}</div>
                        </div>
                    </div>
                </fieldset>
            </div>
        </mat-dialog-content>
        <mat-dialog-actions layout="row">
            <span flex></span>
            <button mat-raised-button color="primary" [disabled]="rootScope?.loading || theForm?.$invalid || !theForm?.$dirty" type="submit">
                {{ (isAdd ? 'action.add' : 'action.save') | translate }}
            </button>
            <button mat-button [disabled]="rootScope?.loading" (click)="cancel()" style="margin-right:20px;">{{ 'action.cancel' | translate }}</button>
        </mat-dialog-actions>
    </form>
</div>
