<form (ngSubmit)="assign()" [attr.aria-label]="'entity-view.assign-to-customer' | translate">
    <mat-toolbar>
        <div class="md-toolbar-tools">
            <h2>{{ 'entity-view.assign-entity-view-to-customer' | translate }}</h2>
            <span flex></span>
            <button mat-icon-button type="button" (click)="cancel()">
                <mat-icon [attr.aria-label]="'dialog.close' | translate">close</mat-icon>
            </button>
        </div>
    </mat-toolbar>
    <mat-progress-bar color="warn" mode="indeterminate" [style.visibility]="rootScope.loading ? 'visible' : 'hidden'"></mat-progress-bar>
    <mat-dialog-content>
        <div class="md-dialog-content">
            <fieldset>
                <span>{{ 'entity-view.assign-entity-view-to-customer-text' | translate }}</span>
                <mat-form-field class="md-block" style="margin-bottom: 0px; width: 100%;">
                    <mat-icon matPrefix [attr.aria-label]="'action.search' | translate" class="material-icons">search</mat-icon>
                    <input matInput id="entity-view-search" name="searchText" autofocus [(ngModel)]="searchText" (ngModelChange)="searchEntityViewTextUpdated()" [placeholder]="'common.enter-search' | translate">
                </mat-form-field>
                <div style="min-height: 150px;">
                    <span layout-align="center center" style="text-transform: uppercase; display: flex; height: 150px;" class="md-subhead" [hidden]="!noData()">{{ 'entity-view.no-entity-views-text' | translate }}</span>
                    <cdk-virtual-scroll-viewport itemSize="48" [hidden]="!hasData()" style="height: 150px; width: 100%;" (scrolledIndexChange)="onScrolled($event)">
                        <mat-list>
                            <mat-list-item *cdkVirtualFor="let entityView of entityViews.data" class="repeated-item">
                                <mat-checkbox (click)="$event.stopPropagation()" (change)="toggleEntityViewSelection(entityView)" [attr.aria-label]="'item.selected' | translate" [checked]="!!entityView?.selected">
                                    {{ entityView?.name }}
                                </mat-checkbox>
                            </mat-list-item>
                        </mat-list>
                    </cdk-virtual-scroll-viewport>
                </div>
            </fieldset>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions layout="row">
        <span flex></span>
        <button mat-raised-button color="primary" type="submit" [disabled]="rootScope.loading || entityViews['selectedCount'] == 0">
            {{ 'action.assign' | translate }}
        </button>
        <button mat-button type="button" [disabled]="rootScope.loading" (click)="cancel()" style="margin-right:20px;">{{ 'action.cancel' | translate }}</button>
    </mat-dialog-actions>
</form>
