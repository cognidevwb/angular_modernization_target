<div flex class="md-content md-padding tb-absolute-fill" layout="column">
    <section layout="row">
        <mat-form-field class="md-block" style="width: 200px;">
            <mat-label>{{ 'event.event-type' | translate }}</mat-label>
            <mat-select [ngModel]="eventType" (ngModelChange)="onEventTypeChange($event)" [disabled]="rootScope.loading">
                @for (type of eventTypeList(); track type.value) {
                <mat-option [value]="type.value">
                    {{type.name | translate}}
                </mat-option>
                }
            </mat-select>
        </mat-form-field>
        <tb-timewindow flex [ngModel]="timewindow" (ngModelChange)="onTimewindowChange($event)" history-only [asButton]="true"></tb-timewindow>
        <button mat-icon-button type="button" [disabled]="rootScope.loading" (click)="reload()"
                matTooltip="{{ 'action.refresh' | translate }}" matTooltipPosition="above">
            <mat-icon>refresh</mat-icon>
        </button>
    </section>
    <div flex layout="column" class="md-whiteframe-z1 tb-event-table">
        <div class="tb-row tb-header" layout="row" layout-align="start center" tb-event-header [eventType]="eventType">
        </div>
        <mat-progress-bar style="max-height: 0px;" mode="indeterminate" [hidden]="!rootScope.loading"></mat-progress-bar>
        <mat-divider></mat-divider>
        <span layout-align="center center" style="margin-top: 25px;" class="tb-prompt" [hidden]="!noData()">{{ 'event.no-events-prompt' | translate }}</span>
        <cdk-virtual-scroll-viewport [hidden]="!hasData()" flex [itemSize]="rowHeight" (scrolledIndexChange)="onScrolledIndexChange($event)">
            <div *cdkVirtualFor="let event of events.data; trackBy: trackByIndex" flex [ngStyle]="hasScroll() ? {'margin-right':'-15px'} : {}">
                <div class="tb-row" flex layout="row" layout-align="start center" tb-event-row [eventType]="eventType" [event]="event">
                </div>
                <mat-divider></mat-divider>
            </div>
        </cdk-virtual-scroll-viewport>
    </div>
</div>
