<section layout="row">
    <div hide-xs hide-sm hide-md [hidden]="!(displayUserInfo())" class="tb-user-info" layout="row">
        <mat-icon attr.aria-label="{{ 'home.avatar' | translate }}" class="material-icons tb-mini-avatar">account_circle</mat-icon>
        <div layout="column">
            <span class="tb-user-display-name">{{userDisplayName()}}</span>
            <span class="tb-user-authority">{{authorityName()}}</span>
        </div>
    </div>
    
        <button mat-icon-button attr.aria-label="{{ 'home.open-user-menu' | translate }}" [matMenuTriggerFor]="menu1">
            <mat-icon md-menu-origin attr.aria-label="{{ 'home.open-user-menu' | translate }}" class="material-icons">more_vert</mat-icon>
        </button>
        <mat-menu #menu1="matMenu">
            
                <button mat-menu-item (click)="openProfile()">
                    <mat-icon md-menu-align-target attr.aria-label="{{ 'home.profile' | translate }}" class="material-icons">account_circle</mat-icon>
                    <span translate>home.profile</span>
                </button>
            
            
                <button mat-menu-item (click)="logout()">
                    <mat-icon md-menu-align-target attr.aria-label="{{ 'home.logout' | translate }}" class="material-icons">exit_to_app</mat-icon>
                    <span translate>home.logout</span>
                </button>
            
        </mat-menu>
    
</section>
