  <mat-sidenav-container class="tb-site-sidenav-container" flex><mat-sidenav class="tb-site-sidenav md-sidenav-left md-whiteframe-z2" [hidden]="!(!forceFullscreen)" hide-print="" aria-label="Toggle Nav" (click)="sidenavClicked()" [mode]="isLockSidenav ? 'side' : 'over'" [opened]="isLockSidenav || isShowSidenav" (closedStart)="isShowSidenav = false" layout="column">
      <header class="tb-nav-header">
          <mat-toolbar class="tb-nav-header-toolbar">
          	 <div flex layout="row" class="md-toolbar-tools inset">
				<img [src]="logoSvg" aria-label="logo" class="tb-logo-title">
          	 </div>
          </mat-toolbar>
      </header>
	  <mat-toolbar flex class="tb-side-menu-toolbar" role="navigation">
		  <tb-side-menu></tb-side-menu>
	  </mat-toolbar>
  </mat-sidenav><mat-sidenav-content>

  <div flex layout="column" tabIndex="-1" role="main">
    <mat-toolbar class="md-whiteframe-z1 tb-primary-toolbar">
    	<div layout="row" flex class="md-toolbar-tools">
		      <button mat-icon-button id="main" hide-gt-sm [hidden]="!(!forceFullscreen)" (click)="openSidenav()" attr.aria-label="{{ 'home.menu' | translate }}" [ngClass]="{'tb-invisible': displaySearchMode()}">
		      		<mat-icon attr.aria-label="{{ 'home.menu' | translate }}" class="material-icons">menu</mat-icon>
		      </button>
			  <button mat-icon-button [hidden]="!(forceFullscreen)" attr.aria-label="{{ 'action.back' | translate }}" (click)="goBack()" [ngClass]="{'tb-invisible': displaySearchMode()}">
				  <mat-icon attr.aria-label="{{ 'action.back' | translate }}" class="material-icons">arrow_back</mat-icon>
			  </button>
	          <button mat-icon-button attr.aria-label="{{ 'action.back' | translate }}" (click)="closeSearch()" [ngClass]="{'tb-invisible': !displaySearchMode()}">
		      	  <mat-icon attr.aria-label="{{ 'action.back' | translate }}" class="material-icons">arrow_back</mat-icon>
	          </button>		    
			  <div flex layout="row" [hidden]="!(!displaySearchMode())" tb-no-animate class="md-toolbar-tools">
				  <tb-breadcrumb [view]="routedView()"></tb-breadcrumb>
			  </div>
			  <div layout="row" [hidden]="!(displaySearchMode())" flex>
				  @if (displayEntitySubtypeSearch()) {
				    <div class="tb-entity-subtype-search" layout="row" layout-align="start center">
					  <tb-entity-subtype-select name="searchEntitySubtype" [(entityType)]="searchConfig.searchEntityType" [(ngModel)]="searchConfig.searchEntitySubtype">
					  </tb-entity-subtype-select>
				  </div>
				  }
				  <mat-form-field [ngClass]="{'tb-entity-search': displayEntitySubtypeSearch()}" flex>
					  <input name="searchText" matInput id="tb-search-text-input" [(ngModel)]="searchConfig.searchText" (ngModelChange)="searchTextUpdated()" attr.placeholder="{{ 'common.enter-search' | translate }}">
				  </mat-form-field>
			  </div>
		      <button mat-icon-button attr.aria-label="{{ 'action.search' | translate }}" [hidden]="!(searchConfig?.searchEnabled)" (click)="openSearch()">
		      	  <mat-icon attr.aria-label="{{ 'action.search' | translate }}" class="material-icons">search</mat-icon>
          	  </button>
		      <button mat-icon-button [hidden]="!(!displaySearchMode())" hide-xs hide-sm (click)="toggleFullscreen()" attr.aria-label="{{ 'fullscreen.toggle' | translate }}">
	    			<mat-icon options='{"easing": "circ-in-out", "duration": 375, "rotation": "none"}'>{{Fullscreen?.isEnabled?.() ? 'fullscreen_exit' : 'fullscreen'}}</mat-icon>
		      </button>
			  <tb-user-menu [displayUserInfo]="!displaySearchMode()">
			  </tb-user-menu>
      	</div>
    </mat-toolbar>
   	<mat-progress-bar color="warn" style="z-index: 10; max-height: 0px; width: 100%;" mode="indeterminate" [style.visibility]="(!rootScope?.loading) ? 'hidden' : 'visible'" [hidden]="!(rootScope?.loading)"></mat-progress-bar>
    
    <div flex layout="column" id="toast-parent" style="position: relative;">
    	<div flex layout="column" class="md-content page-content">
    		<router-outlet (activate)="routedView.set($event)" (deactivate)="routedView.set(null)"></router-outlet>
    	</div>
    </div>
  </div></mat-sidenav-content></mat-sidenav-container>
