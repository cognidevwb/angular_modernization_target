<div [attr.aria-label]="'audit-log.audit-log-details' | translate" class="md-dialog">
    <mat-toolbar>
        <div class="md-toolbar-tools">
            <h2>{{ 'audit-log.audit-log-details' | translate }}</h2>
            <span flex></span>
            <button mat-icon-button type="button" (click)="close()">
                <mat-icon [attr.aria-label]="'dialog.close' | translate">close</mat-icon>
            </button>
        </div>
    </mat-toolbar>
    <mat-dialog-content>
        <div class="md-dialog-content" layout="column">
            <label class="tb-title no-padding">{{ 'audit-log.action-data' | translate }}</label>
            <div name="actionData" flex id="tb-audit-log-action-data" #actionDataEditorElement [readonly]="true" [ui-ace]="actionDataContentOptions" [(ngModel)]="actionData">
            </div>
            <span style="height: 30px;"></span>
            <label [hidden]="!displayFailureDetails" class="tb-title no-padding">{{ 'audit-log.failure-details' | translate }}</label>
            <div name="actionFailureDetails" [hidden]="!displayFailureDetails" flex id="tb-audit-log-failure-details" #failureDetailsEditorElement [readonly]="true" [ui-ace]="failureDetailsContentOptions" [(ngModel)]="actionFailureDetails">
            </div>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions layout="row">
        <span flex></span>
        <button mat-button type="button" [disabled]="rootScope['loading']" (click)="close()" style="margin-right:20px;">{{ 'action.close' |
            translate }}
        </button>
    </mat-dialog-actions>
</div>
