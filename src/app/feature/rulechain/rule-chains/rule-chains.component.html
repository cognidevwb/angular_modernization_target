<tb-grid [config]="ruleChainGridConfig" [itemCardComponent]="ruleChainCard" [addItemComponent]="addRuleChainDialog">
    <div details-buttons>
        <tb-grid-help helpId="rulechains"></tb-grid-help>
    </div>
    @if (grid && grid.operatingItem(); as ruleChain) {
      <mat-tab-group [ngClass]="{'tb-headless': (grid.detailsConfig.isDetailsEditMode || !isRuleChainEditable(ruleChain))}" id="tabs" flex class="tb-absolute-fill" (selectedTabChange)="grid.triggerResize()">
        <mat-tab [label]="'rulechain.details' | translate">
            <tb-rule-chain [ruleChain]="ruleChain" [(isEdit)]="grid.detailsConfig.isDetailsEditMode" [isReadOnly]="grid.isDetailsReadOnly(ruleChain)" [theForm]="grid.detailsForm" (onSetRootRuleChain)="setRootRuleChain($event.event, grid.detailsConfig.currentItem)" (onExportRuleChain)="exportRuleChain($event.event, grid.detailsConfig.currentItem)" (onDeleteRuleChain)="grid.deleteItem($event.event, grid.detailsConfig.currentItem)">
            </tb-rule-chain>
        </mat-tab>
        @if (!grid.detailsConfig.isDetailsEditMode && isRuleChainEditable(ruleChain)) {
          <mat-tab [label]="'attribute.attributes' | translate">
            <tb-attribute-table flex [entityId]="ruleChain.id?.id" [entityType]="types.entityType.rulechain" [entityName]="ruleChain.name" [defaultAttributeScope]="types.attributesScope.server.value"></tb-attribute-table>
          </mat-tab>
          <mat-tab [label]="'attribute.latest-telemetry' | translate">
            <tb-attribute-table flex [entityId]="ruleChain.id?.id" [entityType]="types.entityType.rulechain" [entityName]="ruleChain.name" [defaultAttributeScope]="types.latestTelemetry.value" [disableAttributeScopeSelection]="true"></tb-attribute-table>
          </mat-tab>
          <mat-tab [label]="'alarm.alarms' | translate">
            <tb-alarm-table flex [entityType]="types.entityType.rulechain" [entityId]="ruleChain.id?.id"></tb-alarm-table>
          </mat-tab>
          <mat-tab [label]="'rulechain.events' | translate">
            <tb-event-table flex [entityType]="types.entityType.rulechain" [entityId]="ruleChain.id?.id" [tenantId]="ruleChain.tenantId?.id" [attr.debug-event-types]="types.debugEventType.debugRuleChain.value" [attr.default-event-type]="types.debugEventType.debugRuleChain.value"></tb-event-table>
          </mat-tab>
          <mat-tab [label]="'relation.relations' | translate">
            <tb-relation-table flex [entityId]="ruleChain.id?.id" [entityType]="types.entityType.rulechain"></tb-relation-table>
          </mat-tab>
          @if (grid.isTenantAdmin()) {
            <mat-tab [label]="'audit-log.audit-logs' | translate">
              <tb-audit-log-table flex [entityType]="types.entityType.rulechain" [entityId]="ruleChain.id?.id" [auditLogMode]="types.auditLogMode.entity"></tb-audit-log-table>
            </mat-tab>
          }
        }
      </mat-tab-group>
    }
</tb-grid>
