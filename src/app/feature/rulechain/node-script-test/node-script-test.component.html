<div class="md-dialog tb-node-script-test-dialog" attr.aria-label="{{ 'rulenode.test-script-function' | translate }}" style="width: 800px;">
    <form flex name="theForm" (ngSubmit)="save()">
        <mat-toolbar>
            <div class="md-toolbar-tools">
                <h2>{{ 'rulenode.test-script-function' | translate }}</h2>
                <span flex></span>
                <button mat-icon-button (click)="cancel()">
                    <mat-icon attr.aria-label="{{ 'dialog.close' | translate }}">close</mat-icon>
                </button>
            </div>
        </mat-toolbar>
        <mat-dialog-content flex style="position: relative;">
            <div class="tb-absolute-fill">
                <div id="top_panel" class="tb-split tb-split-vertical">
                    <div id="top_left_panel" class="tb-split tb-content">
                        <div class="tb-resize-container">
                            <div class="tb-editor-area-title-panel">
                                <label>{{ 'rulenode.message' | translate }}</label>
                            </div>
                            <ng-form name="payloadForm">
                                <div layout="column" style="height: 100%;">
                                    <div layout="row">
                                        <tb-message-type-autocomplete name="msgType" style="margin-bottom: 0px; min-width: 300px;" [ngRequired]="true" [(ngModel)]="inputParams.msgType" [(theForm)]="payloadForm">
                                        </tb-message-type-autocomplete>
                                    </div>
                                    <tb-json-content name="msg" flex [(ngModel)]="inputParams.msg" [label]="'rulenode.message' | translate" [(contentType)]="types.contentType.JSON.value" [validateContent]="true" validation-trigger-arg="validatePayload" [fillHeight]="true">
                                    </tb-json-content>
                                </div>
                            </ng-form>
                        </div>
                    </div>
                    <div id="top_right_panel" class="tb-split tb-content">
                        <div class="tb-resize-container" id="metadata-panel">
                            <div class="tb-editor-area-title-panel">
                                <label>{{ 'rulenode.metadata' | translate }}</label>
                            </div>
                            <ng-form name="metadataForm">
                                <tb-key-val-map titleText="rulenode.metadata" [(ngDisabled)]="rootScope.loading" [(keyValMap)]="inputParams.metadata"></tb-key-val-map>
                            </ng-form>
                        </div>
                    </div>
                </div>
                <div id="bottom_panel" class="tb-split tb-split-vertical">
                    <div id="bottom_left_panel" class="tb-split tb-content">
                        <div class="tb-resize-container">
                            <div class="tb-editor-area-title-panel tb-js-function">
                                <label>{{ functionTitle }}</label>
                            </div>
                            <ng-form name="funcBodyForm">
                                <tb-js-func name="script" id="funcBodyInput" [(ngModel)]="inputParams.script" [functionName]="inputParams?.functionName" [functionArgs]="inputParams?.argNames" [validationArgs]="[[inputParams?.msg, inputParams?.metadata, inputParams?.msgType]]" validation-trigger-arg="validateFuncBody" result-type="object" [fillHeight]="true">
                                </tb-js-func>
                            </ng-form>
                        </div>
                    </div>
                    <div id="bottom_right_panel" class="tb-split tb-content">
                        <div class="tb-resize-container">
                            <div class="tb-editor-area-title-panel">
                                <label>{{ 'rulenode.output' | translate }}</label>
                            </div>
                            <tb-json-content name="output" [(ngModel)]="output" [label]="'rulenode.output' | translate" [(contentType)]="types.contentType.JSON.value" [validateContent]="false" [ngReadonly]="true" [fillHeight]="true">
                            </tb-json-content>
                        </div>
                    </div>
                </div>
            </div>
        </mat-dialog-content>
        <mat-dialog-actions layout="row">
            <button mat-raised-button color="primary" [disabled]="rootScope?.loading || theForm?.$invalid" (click)="test()">
                {{ 'rulenode.test' | translate }}
            </button>
            <span flex></span>
            <button mat-raised-button color="primary" [disabled]="rootScope?.loading || theForm?.funcBodyForm?.$invalid || !theForm?.funcBodyForm?.$dirty" type="submit">
                {{ 'action.save' | translate }}
            </button>
            <button mat-button [disabled]="rootScope?.loading" (click)="cancel()" style="margin-right:20px;">{{ 'action.cancel' | translate }}</button>
        </mat-dialog-actions>
    </form>
</div>
