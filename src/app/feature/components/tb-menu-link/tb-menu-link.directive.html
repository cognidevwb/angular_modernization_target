<!-- Ported from src/app/components/menu-link.tpl.html (a link) and menu-toggle.tpl.html (a toggle), which the link function chose between by section.type -->
@if (section()?.type === 'link') {
<a mat-button class="md-button" routerLinkActive="tb-active" [routerLinkActiveOptions]="{exact: true}" [routerLink]="stateHref(router, section()?.state)">
	<mat-icon [hidden]="!(section()?.icon != null)" attr.aria-label="{{section()?.icon}}" class="material-icons">{{section()?.icon}}</mat-icon>
	{{section()?.name | translate}}
</a>
} @else {
<a mat-button class="md-button md-button-toggle" routerLinkActive="tb-active" [routerLinkActiveOptions]="{exact: true}" [routerLink]="stateHref(router, section()?.state)" attr.aria-controls="docs-menu-{{section()?.name | nospace}}" layout="row" attr.aria-expanded="{{sectionActive()}}">
	<mat-icon [hidden]="!(section()?.icon != null)" attr.aria-label="{{section()?.icon}}" class="material-icons">{{section()?.icon}}</mat-icon>
	<span flex>{{section()?.name | translate}}</span>
	<span aria-hidden="true" class=" pull-right fa fa-chevron-down md-toggle-icon" [ngClass]="{'tb-toggled' : sectionActive()}"></span>
</a>
<ul attr.id="docs-menu-{{section()?.name | nospace}}" class="tb-menu-toggle-list" [ngStyle]="{height: sectionHeight()}">
	@for (page of section()?.pages; track $index) {
	  <li>
     	<tb-menu-link [section]="page"></tb-menu-link>
	</li>
	}
</ul>
}
