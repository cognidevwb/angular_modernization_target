<div layout="row" [hidden]="!(!isShareLinkLocal())">
    <button mat-icon-button color="primary" socialshare socialshare-provider="facebook" attr.socialshare-title="{{ shareTitle() }}" attr.socialshare-text="{{ shareText() }}" attr.socialshare-url="{{ shareLink() }}" attr.matTooltip="{{ 'action.share-via' | translate:{provider:'Facebook'} }}" matTooltipPosition="above">
        <mat-icon aria-label="Facebook">facebook</mat-icon>
        
    </button>
    <button mat-icon-button color="primary" socialshare socialshare-provider="twitter" attr.socialshare-text="{{ shareTitle() }}" attr.socialshare-hashtags="{{ shareHashTags() }}" attr.socialshare-url="{{ shareLink() }}" attr.matTooltip="{{ 'action.share-via' | translate:{provider:'Twitter'} }}" matTooltipPosition="above">
        <mat-icon aria-label="Twitter">twitter</mat-icon>
        
    </button>
    <button mat-icon-button color="primary" socialshare socialshare-provider="linkedin" attr.socialshare-text="{{ shareTitle() }}" attr.socialshare-url="{{ shareLink() }}" attr.matTooltip="{{ 'action.share-via' | translate:{provider:'Linkedin'} }}" matTooltipPosition="above">
        <mat-icon aria-label="Linkedin">linkedin</mat-icon>
        
    </button>
    <button mat-icon-button color="primary" socialshare socialshare-provider="reddit" attr.socialshare-text="{{ shareTitle() }}" attr.socialshare-url="{{ shareLink() }}" attr.matTooltip="{{ 'action.share-via' | translate:{provider:'Reddit'} }}" matTooltipPosition="above">
        <mat-icon svgIcon="mdi:reddit" aria-label="Reddit"></mat-icon>
        
    </button>
</div>
