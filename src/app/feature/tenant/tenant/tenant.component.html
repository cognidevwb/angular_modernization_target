<tb-grid [config]="tenantGridConfig" [itemCardComponent]="tenantCard" [addItemComponent]="addTenantDialog">
	<div details-buttons>
		<tb-grid-help helpId="tenants"></tb-grid-help>
	</div>
	@if (grid && grid.operatingItem(); as tenant) {
	  <mat-tab-group [ngClass]="{'tb-headless': grid.detailsConfig.isDetailsEditMode}" id="tabs" flex class="tb-absolute-fill" (selectedTabChange)="grid.triggerResize()">
		<mat-tab [label]="'tenant.details' | translate">
			<tb-tenant [tenant]="tenant" [(isEdit)]="grid.detailsConfig.isDetailsEditMode" [theForm]="grid.detailsForm" (onManageUsers)="openTenantUsers($event.event, grid.detailsConfig.currentItem)" (onDeleteTenant)="grid.deleteItem($event.event, grid.detailsConfig.currentItem)"></tb-tenant>
		</mat-tab>
		@if (!grid.detailsConfig.isDetailsEditMode) {
		  <mat-tab [label]="'attribute.attributes' | translate">
			<tb-attribute-table flex [entityId]="tenant.id?.id" [entityType]="types.entityType.tenant" [entityName]="tenant.title" [defaultAttributeScope]="types.attributesScope.server.value"></tb-attribute-table>
		  </mat-tab>
		  <mat-tab [label]="'attribute.latest-telemetry' | translate">
			<tb-attribute-table flex [entityId]="tenant.id?.id" [entityType]="types.entityType.tenant" [entityName]="tenant.title" [defaultAttributeScope]="types.latestTelemetry.value" [disableAttributeScopeSelection]="true"></tb-attribute-table>
		  </mat-tab>
		  <mat-tab [label]="'alarm.alarms' | translate">
			<tb-alarm-table flex [entityType]="types.entityType.tenant" [entityId]="tenant.id?.id"></tb-alarm-table>
		  </mat-tab>
		  <mat-tab [label]="'tenant.events' | translate">
			<tb-event-table flex [entityType]="types.entityType.tenant" [entityId]="tenant.id?.id" [tenantId]="types.id.nullUid" [attr.default-event-type]="types.eventType.error.value"></tb-event-table>
		  </mat-tab>
		  <mat-tab [label]="'relation.relations' | translate">
			<tb-relation-table flex [entityId]="tenant.id?.id" [entityType]="types.entityType.tenant"></tb-relation-table>
		  </mat-tab>
		}
	  </mat-tab-group>
	}
</tb-grid>
