<tb-grid [config]="widgetsBundleGridConfig" [itemCardComponent]="widgetsBundleCard" [addItemComponent]="addWidgetsBundleDialog">
    @if (grid && grid.operatingItem(); as widgetsBundle) {
      <tb-widgets-bundle [widgetsBundle]="widgetsBundle" [(isEdit)]="grid.detailsConfig.isDetailsEditMode" [isReadOnly]="grid.isDetailsReadOnly(widgetsBundle)" [theForm]="grid.detailsForm" (onExportWidgetsBundle)="exportWidgetsBundle($event.event, grid.detailsConfig.currentItem)" (onDeleteWidgetsBundle)="grid.deleteItem($event.event, grid.detailsConfig.currentItem)">
      </tb-widgets-bundle>
    }
</tb-grid>
