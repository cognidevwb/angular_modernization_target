<div class="tb-switch" layout="column" [ngStyle]="{'pointerEvents': ctx()?.isEdit ? 'none' : 'all'}">
    <div class="error-container" [ngStyle]="{'background': error?.length ? 'rgba(255,255,255,0.25)' : 'none'}" layout="row" layout-align="center center">
        <span class="switch-error">{{ error }}</span>
    </div>
    <div flex="30" class="title-container" layout="row" layout-align="center center" [hidden]="!(showTitle)">
        <span class="switch-title">{{title}}</span>
    </div>
    <div attr.flex="{{showTitle ? 70 : 100}}" id="switch-container" layout="column" layout-align="center center">
        <div class="switch">
            <mat-slide-toggle name="value" aria-label="Switch control" [(ngModel)]="value" (ngModelChange)="onValue()">
            </mat-slide-toggle>
        </div>
        <div class="onoff-container" layout="row" layout-align="center start" [hidden]="!(showOnOffLabels)">
            <span flex class="off-label" [hidden]="!(!value)" style="text-align: center;">OFF</span>
            <span flex [hidden]="!(value)"></span>
            <span flex class="on-label" [hidden]="!(value)" style="text-align: center;">ON</span>
            <span flex [hidden]="!(!value)"></span>
        </div>
    </div>
    <div id="text-measure"></div>
</div>
