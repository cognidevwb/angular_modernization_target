<div flex layout="column" tb-confirm-on-exit [attr.is-dirty]="isDirty">
    <div flex layout="column" [class.tb-fullscreen]="fullscreen" [style.z-index]="fullscreen ? 70 : null">
        <mat-toolbar class="md-whiteframe-z1 tb-edit-toolbar md-hue-3">
            <div flex class="md-toolbar-tools">
                <mat-form-field>
                    <mat-label>&nbsp;</mat-label>
                    <input name="widget" matInput [disabled]="isReadOnly()" [ngModel]="widget?.widgetName" (ngModelChange)="widget.widgetName = $event" attr.placeholder="{{ 'widget.title' | translate }}">
                </mat-form-field>
                <mat-form-field>
                    <mat-select name="widget-2" [disabled]="isReadOnly()" placeholder="{{ 'widget.type' | translate }}" required id="widgetType" [ngModel]="widget?.type" (ngModelChange)="widget.type = $event">
                        @for (type of widgetTypeList; track $index) {
                          <mat-option value="{{type?.value}}">
                            {{ type?.name | translate }}
                        </mat-option>
                        }
                    </mat-select>
                </mat-form-field>
                <span flex=""></span>
                <button mat-button hide-xs hide-sm attr.aria-label="{{ 'widget.run' | translate }}" [disabled]="!iframeWidgetEditModeInited" (click)="applyWidgetScript()" matTooltip="{{ 'widget.run' | translate }} (CTRL + Return)" matTooltipPosition="below">
                    
                    <mat-icon attr.aria-label="{{ 'action.run' | translate }}">play_arrow</mat-icon>
                    <span>{{ 'action.run' | translate }}</span>
                </button>
                <button mat-raised-button hide-xs hide-sm [disabled]="undoDisabled()" attr.aria-label="{{ 'widget.undo' | translate }}" (click)="undoWidget()" matTooltip="{{ 'widget.undo' | translate }} (CTRL + Q)" matTooltipPosition="below">
                    
                    <mat-icon attr.aria-label="{{ 'action.undo' | translate }}">undo</mat-icon>
                    <span>{{ 'action.undo' | translate }}</span>
                </button>
                @if (!isReadOnly()) {
                  <button mat-raised-button hide-xs hide-sm [disabled]="saveDisabled()" attr.aria-label="{{ 'widget.save' | translate }}" (click)="saveWidget()" matTooltip="{{ 'widget.save' | translate }} (CTRL + S)" matTooltipPosition="below">
                    @if (saveWidgetPending) {
                      <mat-progress-spinner mode="indeterminate" diameter="20"></mat-progress-spinner>
                    }
                    <mat-icon attr.aria-label="{{ 'action.save' | translate }}">save</mat-icon>
                    <span>{{ 'action.save' | translate }}</span>
                </button>
                }
                <button mat-raised-button hide-xs hide-sm [disabled]="saveAsDisabled()" attr.aria-label="{{ 'widget.saveAs' | translate }}" (click)="saveWidgetAs($event)" matTooltip="{{ 'widget.saveAs' | translate }} (Shift + CTRL + S)" matTooltipPosition="below">
                    @if (saveWidgetAsPending) {
                      <mat-progress-spinner mode="indeterminate" diameter="20"></mat-progress-spinner>
                    }
                    <mat-icon attr.aria-label="{{ 'action.saveAs' | translate }}">save</mat-icon>
                    <span>{{ 'action.saveAs' | translate }}</span>
                </button>
                <button mat-button hide-xs hide-sm attr.aria-label="{{ 'widget.toggle-fullscreen' | translate }}" (click)="toggleFullscreen()" matTooltip="{{ 'widget.toggle-fullscreen' | translate }} (Shift + CTRL + F)" matTooltipPosition="below">
                    
                    <mat-icon [hidden]="!(!fullscreen)" attr.aria-label="{{ 'widget.toggle-fullscreen' | translate }}">
                        fullscreen
                    </mat-icon>
                    <mat-icon [hidden]="!(fullscreen)" attr.aria-label="{{ 'widget.toggle-fullscreen' | translate }}">
                        fullscreen_exit
                    </mat-icon>
                    <span hide-xs hide-sm>{{ 'widget.toggle-fullscreen' | translate }}</span>
                </button>
                
                    <button mat-icon-button attr.aria-label="{{ 'home.open-user-menu' | translate }}" [matMenuTriggerFor]="menu1">
                        <mat-icon md-menu-origin attr.aria-label="{{ 'home.open-user-menu' | translate }}" class="material-icons">more_vert</mat-icon>
                    </button>
                    <mat-menu #menu1="matMenu">
                        
                            <button mat-menu-item [disabled]="!iframeWidgetEditModeInited" (click)="applyWidgetScript()">
                                <mat-icon md-menu-align-target attr.aria-label="{{ 'action.run' | translate }}" class="material-icons">play_arrow</mat-icon>
                                <span>{{ 'action.run' | translate }}</span>
                            </button>
                        
                        
                            <button mat-menu-item [disabled]="undoDisabled()" (click)="undoWidget()">
                                <mat-icon md-menu-align-target attr.aria-label="{{ 'action.undo' | translate }}" class="material-icons">undo</mat-icon>
                                <span>{{ 'action.undo' | translate }}</span>
                            </button>
                        
                        
                            <button mat-menu-item [disabled]="saveDisabled()" (click)="saveWidget()">
                                <mat-icon md-menu-align-target attr.aria-label="{{ 'action.save' | translate }}" class="material-icons">save</mat-icon>
                                <span>{{ 'action.save' | translate }}</span>
                            </button>
                        
                        
                            <button mat-menu-item [disabled]="saveAsDisabled()" (click)="saveWidgetAs($event)">
                                <mat-icon md-menu-align-target attr.aria-label="{{ 'action.saveAs' | translate }}" class="material-icons">save</mat-icon>
                                <span>{{ 'action.saveAs' | translate }}</span>
                            </button>
                        
                    </mat-menu>
                
            </div>
        </mat-toolbar>
        <div flex style="position: relative;">
            <div class="tb-editor tb-absolute-fill">
                <div id="top_panel" class="tb-split tb-split-vertical">
                    <div id="top_left_panel" class="tb-split tb-content">
                        <mat-tab-group [selectedIndex]="1" class="container">
                            <mat-tab label="{{ 'widget.resources' | translate }}">
                                <div class="tb-resize-container" style="background-color: #fff;">
                                    <div class="md-padding">
                                        @for (resource of widget?.resources; track $index) {
                                          <div flex layout="row" style="max-height: 40px;" layout-align="start center">
                                            <mat-form-field flex class="md-block" style="margin: 10px 0 0; max-height: 40px;">
                                                <input matInput attr.placeholder="{{ 'widget.resource-url' | translate }}" [required]="true" name="resource" [(ngModel)]="resource.url">
                                            </mat-form-field>
                                            <button mat-icon-button color="primary" [disabled]="rootScope?.loading" (click)="removeResource($index)" attr.aria-label="{{ 'action.remove' | translate }}" matTooltip="{{ 'widget.remove-resource' | translate }}" matTooltipPosition="above">
                                                
                                                <mat-icon attr.aria-label="{{ 'action.delete' | translate }}" class="material-icons">
                                                    close
                                                </mat-icon>
                                            </button>
                                        </div>
                                        }
                                        <div>
                                            <button mat-raised-button color="primary" [disabled]="rootScope?.loading" (click)="addResource()" attr.aria-label="{{ 'action.add' | translate }}" matTooltip="{{ 'widget.add-resource' | translate }}" matTooltipPosition="above">
                                                
                                                <span>{{ 'action.add' | translate }}</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </mat-tab>
                            <mat-tab label="{{ 'widget.html' | translate }}">
                                <div class="tb-resize-container" [class.tb-fullscreen]="expandedPanel === 'html'" [style.z-index]="expandedPanel === 'html' ? 70 : null">
                                    <div class="tb-editor-area-title-panel">
                                        <button mat-button attr.aria-label="{{ 'widget.tidy' | translate }}" (click)="beautifyHtml()">{{ 'widget.tidy' | translate }}
                                        </button>
                                        <button mat-icon-button id="expand-button" attr.aria-label="{{ 'fullscreen.fullscreen' | translate }}" class="tb-md-32" (click)="toggleExpandedPanel('html', $event)" [matTooltip]="(expandedPanel === 'html' ? 'fullscreen.exit' : 'fullscreen.expand') | translate" [matTooltipPosition]="expandedPanel === 'html' ? 'below' : 'above'"><mat-icon>{{ expandedPanel === 'html' ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon></button>
                                    </div>
                                    <div id="html_input" [tbWidgetAce]="htmlEditorOptions" [value]="widget?.templateHtml" (valueChange)="widget.templateHtml = $event"></div>
                                </div>
                            </mat-tab>
                            <mat-tab label="{{ 'widget.css' | translate }}">
                                <div class="tb-resize-container" [class.tb-fullscreen]="expandedPanel === 'css'" [style.z-index]="expandedPanel === 'css' ? 70 : null">
                                    <div class="tb-editor-area-title-panel">
                                        <button mat-button attr.aria-label="{{ 'widget.tidy' | translate }}" (click)="beautifyCss()">{{ 'widget.tidy' | translate }}
                                        </button>
                                        <button mat-icon-button id="expand-button" attr.aria-label="{{ 'fullscreen.fullscreen' | translate }}" class="tb-md-32" (click)="toggleExpandedPanel('css', $event)" [matTooltip]="(expandedPanel === 'css' ? 'fullscreen.exit' : 'fullscreen.expand') | translate" [matTooltipPosition]="expandedPanel === 'css' ? 'below' : 'above'"><mat-icon>{{ expandedPanel === 'css' ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon></button>
                                    </div>
                                    <div id="css_input" [tbWidgetAce]="cssEditorOptions" [value]="widget?.templateCss" (valueChange)="widget.templateCss = $event"></div>
                                </div>
                            </mat-tab>
                        </mat-tab-group>
                    </div>
                    <div id="top_right_panel" class="tb-split tb-content">
                        <mat-tab-group class="container">
                            <mat-tab label="{{ 'widget.settings-schema' | translate }}">
                                <div class="tb-resize-container" [class.tb-fullscreen]="expandedPanel === 'settings'" [style.z-index]="expandedPanel === 'settings' ? 70 : null">
                                    <div class="tb-editor-area-title-panel">
                                        <button mat-button attr.aria-label="{{ 'widget.tidy' | translate }}" (click)="beautifyJson()">{{ 'widget.tidy' | translate }}
                                        </button>
                                        <button mat-icon-button id="expand-button" attr.aria-label="{{ 'fullscreen.fullscreen' | translate }}" class="tb-md-32" (click)="toggleExpandedPanel('settings', $event)" [matTooltip]="(expandedPanel === 'settings' ? 'fullscreen.exit' : 'fullscreen.expand') | translate" [matTooltipPosition]="expandedPanel === 'settings' ? 'below' : 'above'"><mat-icon>{{ expandedPanel === 'settings' ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon></button>
                                    </div>
                                    <div id="settings_json_input" [tbWidgetAce]="jsonSettingsEditorOptions" [value]="widget?.settingsSchema" (valueChange)="widget.settingsSchema = $event"></div>
                                </div>
                            </mat-tab>
                            <mat-tab label="{{ 'widget.datakey-settings-schema' | translate }}">
                                <div class="tb-resize-container" [class.tb-fullscreen]="expandedPanel === 'datakey'" [style.z-index]="expandedPanel === 'datakey' ? 70 : null">
                                    <div class="tb-editor-area-title-panel">
                                        <button mat-button attr.aria-label="{{ 'widget.tidy' | translate }}" (click)="beautifyDataKeyJson()">{{ 'widget.tidy' | translate }}
                                        </button>
                                        <button mat-icon-button id="expand-button" attr.aria-label="{{ 'fullscreen.fullscreen' | translate }}" class="tb-md-32" (click)="toggleExpandedPanel('datakey', $event)" [matTooltip]="(expandedPanel === 'datakey' ? 'fullscreen.exit' : 'fullscreen.expand') | translate" [matTooltipPosition]="expandedPanel === 'datakey' ? 'below' : 'above'"><mat-icon>{{ expandedPanel === 'datakey' ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon></button>
                                    </div>
                                    <div id="settings_json_input" [tbWidgetAce]="dataKeyJsonSettingsEditorOptions" [value]="widget?.dataKeySettingsSchema" (valueChange)="widget.dataKeySettingsSchema = $event"></div>
                                </div>
                            </mat-tab>
                        </mat-tab-group>
                    </div>
                </div>
                <div id="bottom_panel" class="tb-split tb-split-vertical">
                    <div id="javascript_panel" class="tb-split tb-content">
                        <div class="tb-resize-container" [class.tb-fullscreen]="expandedPanel === 'javascript'" [style.z-index]="expandedPanel === 'javascript' ? 70 : null">
                            <div class="tb-editor-area-title-panel">
                                <label for="javascript_input">{{ 'widget.javascript' | translate }}</label>
                                <button mat-button attr.aria-label="{{ 'widget.tidy' | translate }}" (click)="beautifyJs()">{{
                                    'widget.tidy' | translate }}
                                </button>
                                <button mat-icon-button id="expand-button" attr.aria-label="{{ 'fullscreen.fullscreen' | translate }}" class="tb-md-32" (click)="toggleExpandedPanel('javascript', $event)" [matTooltip]="(expandedPanel === 'javascript' ? 'fullscreen.exit' : 'fullscreen.expand') | translate" [matTooltipPosition]="expandedPanel === 'javascript' ? 'below' : 'above'"><mat-icon>{{ expandedPanel === 'javascript' ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon></button>
                            </div>
                            <div id="javascript_input" [tbWidgetAce]="jsEditorOptions" [value]="widget?.controllerScript" (valueChange)="widget.controllerScript = $event"></div>
                        </div>
                    </div>
                    <div id="frame_panel" class="tb-split tb-content" style="overflow-y: hidden; position: relative;">
                        <div flex layout="column" class="md-content tb-progress-cover" layout-align="center center" [hidden]="!(!iframeWidgetEditModeInited)">
                            <mat-progress-spinner color="warn" [style.visibility]="(iframeWidgetEditModeInited) ? 'hidden' : 'visible'" mode="indeterminate" diameter="100"></mat-progress-spinner>
                        </div>
                        <div [class.tb-fullscreen]="expandedPanel === 'frame'" [style.z-index]="expandedPanel === 'frame' ? 70 : null" class="container">
                            <iframe frameborder="0" height="100%" width="100%"></iframe>
                            <button mat-icon-button id="expand-button" aria-label="Fullscreen" class="tb-fullscreen-button-style" style="position: absolute; top: 10px; left: 10px; bottom: initial;" (click)="toggleExpandedPanel('frame', $event)" [matTooltip]="(expandedPanel === 'frame' ? 'fullscreen.exit' : 'fullscreen.expand') | translate" [matTooltipPosition]="expandedPanel === 'frame' ? 'below' : 'above'"><mat-icon>{{ expandedPanel === 'frame' ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div flex layout="column" class="md-content tb-progress-cover" layout-align="center center" [hidden]="!(!layoutInited)">
        <mat-progress-spinner color="warn" mode="indeterminate" [style.visibility]="(layoutInited) ? 'hidden' : 'visible'" diameter="100"></mat-progress-spinner>
    </div>
</div>
