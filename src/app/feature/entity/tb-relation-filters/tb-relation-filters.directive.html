<div class="tb-relation-filters">
    <div class="header" [hidden]="!(relationFilters?.length)">
        <div layout="row" layout-align="start center">
            <span class="cell" style="width: 200px; min-width: 200px;">{{ 'relation.type' | translate }}</span>
            <span class="cell" flex>{{ 'entity.entity-types' | translate }}</span>
            <span class="cell" style="width: 40px; min-width: 40px;">&nbsp</span>
        </div>
    </div>
    <div class="body" [hidden]="!(relationFilters?.length)">
        <!-- TODO(port): ng-form has no one-to-one Angular form -->
        @for (filter of relationFilters; track $index) {
          <div class="row" ng-form name="relationFilterForm" flex layout="row" layout-align="start center">
            <div class="md-whiteframe-1dp" flex layout="row" layout-align="start center">
                <tb-relation-type-autocomplete name="relationType" class="cell" style="width: 200px; min-width: 200px;" hide-label [(theForm)]="relationFilterForm" [(ngModel)]="filter.relationType" [tbRequired]="false">
                </tb-relation-type-autocomplete>
                <tb-entity-type-list name="entityTypes" class="cell" flex [(ngModel)]="filter.entityTypes" [(allowedEntityTypes)]="allowedEntityTypes" [tbRequired]="false">
                </tb-entity-type-list>
                <button mat-icon-button color="primary" [disabled]="rootScope?.loading" style="width: 40px; min-width: 40px;" (click)="removeFilter($event, filter)" attr.aria-label="{{ 'action.remove' | translate }}" attr.matTooltip="{{ 'relation.remove-relation-filter' | translate }}" matTooltipPosition="above">
                    
                    <mat-icon attr.aria-label="{{ 'action.remove' | translate }}" class="material-icons">
                        close
                    </mat-icon>
                </button>
            </div>
        </div>
        }
    </div>
    <div class="any-filter" [hidden]="!(!relationFilters?.length)">
        <span layout-align="center center" class="tb-prompt">{{ 'relation.any-relation' | translate }}</span>
    </div>
    <div>
        <button mat-raised-button color="primary" [disabled]="rootScope?.loading" (click)="addFilter($event)" attr.aria-label="{{ 'action.add' | translate }}" attr.matTooltip="{{ 'relation.add-relation-filter' | translate }}" matTooltipPosition="above">
            
            <mat-icon attr.aria-label="{{ 'action.add' | translate }}" class="material-icons">
                add
            </mat-icon>
            {{ 'action.add' | translate }}
        </button>
    </div>
</div>
