<tb-grid [config]="dashboardGridConfig" [itemCardComponent]="dashboardCard" [addItemComponent]="addDashboardDialog">
	<div details-buttons>
		<tb-grid-help helpId="dashboards"></tb-grid-help>
	</div>
	@if (grid && grid.operatingItem(); as dashboard) {
	  <mat-tab-group [ngClass]="{'tb-headless': grid.detailsConfig.isDetailsEditMode}" id="tabs" flex class="tb-absolute-fill" (selectedTabChange)="grid.triggerResize()">
		<mat-tab [label]="'dashboard.details' | translate">
			<tb-dashboard-details [dashboard]="dashboard" [(isEdit)]="grid.detailsConfig.isDetailsEditMode" [dashboardScope]="dashboardsScope" [customerId]="customerId" [theForm]="grid.detailsForm" (onMakePublic)="makePublic($event.event, grid.detailsConfig.currentItem)" (onMakePrivate)="makePrivate($event.event, grid.detailsConfig.currentItem)" (onManageAssignedCustomers)="manageAssignedCustomers($event.event, grid.detailsConfig.currentItem)" (onUnassignFromCustomer)="unassignFromCustomer($event.event, grid.detailsConfig.currentItem, customerId)" (onExportDashboard)="exportDashboard($event.event, grid.detailsConfig.currentItem)" (onDeleteDashboard)="grid.deleteItem($event.event, grid.detailsConfig.currentItem)"></tb-dashboard-details>
		</mat-tab>
		@if (!grid.detailsConfig.isDetailsEditMode && grid.isTenantAdmin()) {
		  <mat-tab [label]="'audit-log.audit-logs' | translate">
			<tb-audit-log-table flex [entityType]="types.entityType.dashboard" [entityId]="dashboard.id?.id" [auditLogMode]="types.auditLogMode.entity"></tb-audit-log-table>
		  </mat-tab>
		}
	  </mat-tab-group>
	}
</tb-grid>
