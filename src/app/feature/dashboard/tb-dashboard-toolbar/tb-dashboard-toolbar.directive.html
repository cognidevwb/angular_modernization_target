<div class="tb-fab-toolbar" [class.md-is-open]="toolbarOpened()"
     [ngClass]="{'is-fullscreen': forceFullscreen(), 'md-whiteframe-z1': forceFullscreen() && toolbarOpened() }">
    <div class="tb-fab-toolbar-wrapper">
        <mat-toolbar class="tb-fab-toolbar-content" [class.tb-closed]="!toolbarOpened()">
            <div class="md-toolbar-tools tb-fab-actions">
                <div class="md-fab-action-item"><ng-content></ng-content></div>
            </div>
        </mat-toolbar>
        <div class="tb-fab-trigger align-with-text" [hidden]="toolbarOpened()">
            <button mat-mini-fab color="primary" aria-label="menu" (click)="onTriggerClick.emit(undefined)"
                    [matTooltip]="'dashboard.open-toolbar' | translate" [matTooltipDisabled]="toolbarOpened()" matTooltipPosition="below">
                <mat-icon aria-label="dashboard-toolbar" class="material-icons">more_horiz</mat-icon>
            </button>
        </div>
    </div>
</div>
