<tb-grid [config]="entityViewGridConfig" [itemCardComponent]="entityViewCard" [addItemComponent]="addEntityViewDialog">
    <div details-buttons>
        <tb-grid-help helpId="entityViews"></tb-grid-help>
    </div>
    @if (grid && grid.operatingItem(); as entityView) {
      <mat-tab-group [ngClass]="{'tb-headless': grid.detailsConfig.isDetailsEditMode}" id="tabs" flex class="tb-absolute-fill" (selectedTabChange)="grid.triggerResize()">
        <mat-tab [label]="'entity-view.details' | translate">
            <tb-entity-view [entityView]="entityView" [(isEdit)]="grid.detailsConfig.isDetailsEditMode" [entityViewScope]="entityViewsScope" [theForm]="grid.detailsForm" (onAssignToCustomer)="assignToCustomer($event.event, [grid.detailsConfig.currentItem.id.id])" (onMakePublic)="makePublic($event.event, grid.detailsConfig.currentItem)" (onUnassignFromCustomer)="unassignFromCustomer($event.event, grid.detailsConfig.currentItem, $event.isPublic)" (onDeleteEntityView)="grid.deleteItem($event.event, grid.detailsConfig.currentItem)"></tb-entity-view>
        </mat-tab>
        @if (!grid.detailsConfig.isDetailsEditMode) {
          <mat-tab [label]="'attribute.attributes' | translate">
            <tb-attribute-table flex [entityId]="entityView.id?.id" [entityType]="types.entityType.entityView" [entityName]="entityView.name" [defaultAttributeScope]="types.attributesScope.client.value"></tb-attribute-table>
          </mat-tab>
          <mat-tab [label]="'attribute.latest-telemetry' | translate">
            <tb-attribute-table flex [entityId]="entityView.id?.id" [entityType]="types.entityType.entityView" [entityName]="entityView.name" [defaultAttributeScope]="types.latestTelemetry.value" [disableAttributeScopeSelection]="true"></tb-attribute-table>
          </mat-tab>
          <mat-tab [label]="'alarm.alarms' | translate">
            <tb-alarm-table flex [entityType]="types.entityType.entityView" [entityId]="entityView.id?.id"></tb-alarm-table>
          </mat-tab>
          <mat-tab [label]="'entity-view.events' | translate">
            <tb-event-table flex [entityType]="types.entityType.entityView" [entityId]="entityView.id?.id" [tenantId]="entityView.tenantId?.id" [attr.default-event-type]="types.eventType.error.value"></tb-event-table>
          </mat-tab>
          <mat-tab [label]="'relation.relations' | translate">
            <tb-relation-table flex [entityId]="entityView.id?.id" [entityType]="types.entityType.entityView"></tb-relation-table>
          </mat-tab>
          @if (grid.isTenantAdmin()) {
            <mat-tab [label]="'audit-log.audit-logs' | translate">
              <tb-audit-log-table flex [entityType]="types.entityType.entityView" [entityId]="entityView.id?.id" [auditLogMode]="types.auditLogMode.entity"></tb-audit-log-table>
            </mat-tab>
          }
        }
      </mat-tab-group>
    }
</tb-grid>
