<form [attr.aria-label]="'user.activation-link' | translate" style="min-width: 400px;">
    <mat-toolbar>
        <div class="md-toolbar-tools">
            <h2>{{ 'user.activation-link' | translate }}</h2>
            <span flex></span>
            <button mat-icon-button type="button" (click)="close()">
                <mat-icon [attr.aria-label]="'dialog.close' | translate">close</mat-icon>
            </button>
        </div>
    </mat-toolbar>
    <mat-dialog-content>
        <div id="activation-link-dialog-content" class="md-dialog-content">
            <div class="md-content md-padding" layout="column">
                <span [innerHTML]="'user.activation-link-text' | translate: { activationLink: activationLink }"></span>
                <div layout="row" layout-align="start center">
                    <pre class="tb-highlight" flex><code>{{ activationLink }}</code></pre>
                    <button mat-icon-button type="button" (click)="copyActivationLink($event)" [matTooltip]="'user.copy-activation-link' | translate" matTooltipPosition="above">
                        <mat-icon svgIcon="mdi:clipboard-arrow-left"></mat-icon>
                    </button>
                </div>
            </div>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions layout="row">
        <span flex></span>
        <button mat-button type="button" (click)="close()">{{ 'action.ok' | translate }}</button>
    </mat-dialog-actions>
</form>
