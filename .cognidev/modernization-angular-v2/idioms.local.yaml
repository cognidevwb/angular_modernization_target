# This repo's own idiom decisions, in the format of the playbook's idioms.yaml.
# The scan writes one entry per name the shipped catalog does not place, and
# DEFAULTS it to `note`: the port has no rewrite for such a name, so it keeps the
# code as written and marks the line — with or without this file.
# Editing an entry records a decision for a reader (IDIOM-COVERAGE.md lists every
# use with its file and line); it does not change what the port emits, which reads
# the shipped catalog only. Add `pending: true` to an entry to make the port
# REFUSE to run until that name is settled.
